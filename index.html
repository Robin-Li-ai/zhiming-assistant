            <button class="btn btn-ghost btn-sm text-danger" data-action="delete-task" data-id="${task.id}" title="删除">删除</button>
            ${canMoveRight ? `<button class="btn btn-ghost btn-sm" data-action="move-right" data-id="${task.id}" title="移到下一列">→</button>` : ''}
          </div>
        </div>
      `;
    };

    const renderColumn = (col) => {
      const tasks = DataStore.Work.getTasksByStatus(col.id);
      const tasksHtml = tasks.length > 0
        ? tasks.map(renderTaskCard).join('')
        : `<div class="work-column-empty">暂无任务</div>`;

      const clearBtn = col.id === 'done' && tasks.length > 0
        ? `<button class="btn btn-ghost btn-sm text-danger" data-action="clear-done">清除已完成</button>`
        : '';

      return `
        <div class="work-column">
          <div class="work-column-header">
            <span class="work-column-title">${col.name}</span>
            <span class="work-column-count">${tasks.length}</span>
            ${clearBtn}
          </div>
          <div class="work-column-body">
            ${tasksHtml}
          </div>
        </div>
      `;
    };

    const totalTasks = DataStore.Work.getAllTasks().length;

    container.innerHTML = `
      <div class="page-header">
        <h2>工作计划</h2>
        <p>共 ${totalTasks} 个任务 · 看板视图管理工作进度</p>
      </div>
      <div class="work-toolbar">
        <button class="btn btn-primary" data-action="new-task">
          <span>新建任务</span>
        </button>
      </div>
      <div class="work-board">
        ${columns.map(renderColumn).join('')}
      </div>

      <div class="chart-section">
        <h3 class="chart-section-title">工作统计</h3>
        <div class="chart-grid">
          <div class="chart-card glass-card">
            <div class="chart-card-title">完成率</div>
            <div style="display: flex; justify-content: center;">
              ${Charts.progressRing({
                value: DataStore.Work.getTasksByStatus('done').length,
                max: totalTasks || 1,
                size: 120,
                strokeWidth: 10,
                color: 'var(--success)',
                sublabel: '已完成/总数'
              })}
            </div>
          </div>
          <div class="chart-card glass-card">
            <div class="chart-card-title">状态分布</div>
            ${Charts.donutChart({
              data: [
                { label: '待办', value: DataStore.Work.getTasksByStatus('todo').length, color: 'var(--warning)' },
                { label: '进行中', value: DataStore.Work.getTasksByStatus('in_progress').length, color: 'var(--primary)' },
                { label: '已完成', value: DataStore.Work.getTasksByStatus('done').length, color: 'var(--success)' }
              ],
              size: 120,
              strokeWidth: 20,
              centerLabel: totalTasks,
              centerSublabel: '总任务'
            })}
          </div>
        </div>
        <div class="chart-grid" style="margin-top: 16px; grid-template-columns: repeat(4, 1fr);">
          ${Charts.statCard({ label: '总任务', value: totalTasks, color: 'var(--primary)', icon: '📋' })}
          ${Charts.statCard({ label: '待办', value: DataStore.Work.getTasksByStatus('todo').length, color: 'var(--warning)', icon: '⏳' })}
          ${Charts.statCard({ label: '进行中', value: DataStore.Work.getTasksByStatus('in_progress').length, color: 'var(--primary)', icon: '🔄' })}
          ${Charts.statCard({ label: '已完成', value: DataStore.Work.getTasksByStatus('done').length, color: 'var(--success)', icon: '✅' })}
        </div>
      </div>
    `;

    // 事件委托
    Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      const showTaskForm = (task) => {
        const isEdit = !!task;
        // 解析截止日期
        let dueYear = '', dueMonth = '', dueDay = '';
        if (task && task.dueDate) {
          const parts = task.dueDate.split('-');
          if (parts.length === 3) {
            dueYear = parts[0];
            dueMonth = String(parseInt(parts[1], 10));
            dueDay = String(parseInt(parts[2], 10));
          }
        }
        // 生成年份选项（当前年到当前年+5）
        const currentYear = new Date().getFullYear();
        const yearOptions = [`<option value="">年</option>`];
        for (let y = currentYear; y <= currentYear + 5; y++) {
          yearOptions.push(`<option value="${y}" ${dueYear === String(y) ? 'selected' : ''}>${y}年</option>`);
        }
        // 生成月份选项
        const monthOptions = [`<option value="">月</option>`];
        for (let m = 1; m <= 12; m++) {
          monthOptions.push(`<option value="${m}" ${dueMonth === String(m) ? 'selected' : ''}>${m}月</option>`);
        }
        // 生成日期选项
        const dayOptions = [`<option value="">日</option>`];
        for (let d = 1; d <= 31; d++) {
          dayOptions.push(`<option value="${d}" ${dueDay === String(d) ? 'selected' : ''}>${d}日</option>`);
        }

        const modal = UI.showModal({
          title: isEdit ? '编辑任务' : '新建任务',
          body: `
            <div class="form-group"><label>任务标题</label><input type="text" class="input" id="work-task-title" value="${task ? Utils.escapeHtml(task.title) : ''}" placeholder="任务标题" /></div>
            <div class="form-row">
              <div class="form-group"><label>项目标签</label><input type="text" class="input" id="work-task-project" value="${task ? Utils.escapeHtml(task.project || '') : ''}" placeholder="例如：项目A" /></div>
              <div class="form-group"><label>截止日期</label>
                <div class="date-select-row">
                  <select class="select" id="work-task-due-year">${yearOptions.join('')}</select>
                  <select class="select" id="work-task-due-month">${monthOptions.join('')}</select>
                  <select class="select" id="work-task-due-day">${dayOptions.join('')}</select>
                </div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>优先级</label>
                <select class="select" id="work-task-priority">
                  <option value="high" ${task && task.priority === 'high' ? 'selected' : ''}>高</option>
                  <option value="medium" ${!task || task.priority === 'medium' ? 'selected' : ''}>中</option>
                  <option value="low" ${task && task.priority === 'low' ? 'selected' : ''}>低</option>
                </select>
              </div>
              <div class="form-group"><label>状态</label>
                <select class="select" id="work-task-status">
                  <option value="todo" ${!task || task.status === 'todo' ? 'selected' : ''}>待办</option>
                  <option value="in_progress" ${task && task.status === 'in_progress' ? 'selected' : ''}>进行中</option>
                  <option value="done" ${task && task.status === 'done' ? 'selected' : ''}>已完成</option>
                </select>
              </div>
            </div>
            <div class="form-group"><label>备注</label><textarea class="textarea" id="work-task-notes" placeholder="可选备注">${task ? Utils.escapeHtml(task.notes || '') : ''}</textarea></div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>${isEdit ? '保存' : '创建'}</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const title = modal.root.querySelector('#work-task-title').value.trim();
          if (!title) return;
          // 组合截止日期
          const y = modal.root.querySelector('#work-task-due-year').value;
          const m = modal.root.querySelector('#work-task-due-month').value;
          const d = modal.root.querySelector('#work-task-due-day').value;
          let dueDate = '';
          if (y && m && d) {
            dueDate = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          }
          const data = {
            title,
            project: modal.root.querySelector('#work-task-project').value.trim(),
            dueDate,
            priority: modal.root.querySelector('#work-task-priority').value,
            status: modal.root.querySelector('#work-task-status').value,
            notes: modal.root.querySelector('#work-task-notes').value.trim()
          };
          if (isEdit) {
            DataStore.Work.updateTask(id, data);
          } else {
            DataStore.Work.addTask(data);
          }
          modal.close();
          Pages.renderWork(container);
        });
      };

      if (action === 'new-task') {
        showTaskForm(null);
      } else if (action === 'edit-task' && id) {
        const task = App.state.data.work.tasks.find(t => t.id === id);
        if (task) showTaskForm(task);
      } else if (action === 'move-left' && id) {
        const task = App.state.data.work.tasks.find(t => t.id === id);
        if (task) {
          const idx = columns.findIndex(c => c.id === task.status);
          if (idx > 0) DataStore.Work.moveTask(id, columns[idx - 1].id);
        }
        Pages.renderWork(container);
      } else if (action === 'move-right' && id) {
        const task = App.state.data.work.tasks.find(t => t.id === id);
        if (task) {
          const idx = columns.findIndex(c => c.id === task.status);
          if (idx < columns.length - 1) DataStore.Work.moveTask(id, columns[idx + 1].id);
        }
        Pages.renderWork(container);
      } else if (action === 'delete-task' && id) {
        UI.confirm({
          title: '删除任务',
          message: '确定要删除这个工作任务吗？',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            DataStore.Work.deleteTask(id);
            Pages.renderWork(container);
          }
        });
      } else if (action === 'clear-done') {
        UI.confirm({
          title: '清除已完成',
          message: '确定要清除所有已完成的任务吗？',
          confirmText: '清除',
          danger: true,
          onConfirm: () => {
            DataStore.Work.clearCompleted();
            Pages.renderWork(container);
          }
        });
      }
    });
  },

  renderFitness(container) {
    // 当前标签页（模块局部变量）
    if (typeof Pages._fitnessTab === 'undefined') {
      Pages._fitnessTab = 'plans';
    }

    const weekdays = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
    const weekdayNames = { monday: '周一', tuesday: '周二', wednesday: '周三', thursday: '周四', friday: '周五', saturday: '周六', sunday: '周日' };
    const todayWeekday = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date().getDay()];

    const renderPlansTab = () => {
      const renderDayColumn = (weekday) => {
        const plan = DataStore.Fitness.getPlanByWeekday(weekday);
        const exercises = plan ? plan.exercises : [];
        const isToday = weekday === todayWeekday;

        const exercisesHtml = exercises.length > 0
          ? exercises.map(ex => `
              <div class="fitness-exercise-item" data-plan-id="${plan.id}" data-ex-id="${ex.id}">
                <div class="fitness-exercise-name">${Utils.escapeHtml(ex.name)}<span class="fitness-part-tag">${Utils.escapeHtml(ex.part || '其他')}</span></div>
                <div class="fitness-exercise-detail">
                  <span>${ex.sets}组 × ${ex.reps}次</span>
                  <span>${ex.weight}kg</span>
                </div>
                <div class="fitness-exercise-actions">
                  <button class="btn btn-ghost btn-sm" data-action="edit-exercise" data-plan-id="${plan.id}" data-ex-id="${ex.id}">编辑</button>
                  <button class="btn btn-ghost btn-sm text-danger" data-action="delete-exercise" data-plan-id="${plan.id}" data-ex-id="${ex.id}">删除</button>
                </div>
              </div>
            `).join('')
          : `<div class="fitness-empty">暂无动作</div>`;

        return `
          <div class="fitness-day-column ${isToday ? 'today' : ''}">
            <div class="fitness-day-header">
              <span class="fitness-day-name">${weekdayNames[weekday]}</span>
              ${isToday ? '<span class="fitness-today-badge">今天</span>' : ''}
              <button class="btn btn-ghost btn-sm" data-action="add-exercise" data-weekday="${weekday}">+</button>
            </div>
            <div class="fitness-day-body">
              ${exercisesHtml}
            </div>
            ${isToday && exercises.length > 0 ? `
              <div class="fitness-day-footer">
                <button class="btn btn-primary btn-sm w-full" data-action="start-training" data-plan-id="${plan.id}">开始训练</button>
              </div>
            ` : ''}
          </div>
        `;
      };

      const weekCount = DataStore.Fitness.getWeekTrainingCount();

      return `
        <div class="fitness-stats-bar">
          <span>本周已训练 <strong>${weekCount}</strong> 次</span>
        </div>
        <div class="fitness-week-grid">
          ${weekdays.map(renderDayColumn).join('')}
        </div>
      `;
    };

    const renderBodyDataTab = () => {
      const bodyData = DataStore.Fitness.getBodyData();
      const latest = DataStore.Fitness.getLatestBodyData();
      const previous = DataStore.Fitness.getPreviousBodyData();

      const diffText = (current, prev, unit) => {
        if (current == null || prev == null) return '';
        const diff = (current - prev).toFixed(1);
        if (diff > 0) return `<span class="diff-up">+${diff}${unit}</span>`;
        if (diff < 0) return `<span class="diff-down">${diff}${unit}</span>`;
        return `<span class="diff-same">0${unit}</span>`;
      };

      const listHtml = bodyData.length > 0
        ? bodyData.map((d, idx) => {
            const prev = bodyData[idx + 1];
            return `
              <div class="body-data-item" data-id="${d.id}">
                <div class="body-data-date">${Utils.formatDate(d.date)}</div>
                <div class="body-data-values">
                  ${d.weight != null ? `<div class="body-data-value"><span class="bd-label">体重</span><span class="bd-num">${d.weight}kg</span>${prev && prev.weight != null ? diffText(d.weight, prev.weight, 'kg') : ''}</div>` : ''}
                  ${d.chest != null ? `<div class="body-data-value"><span class="bd-label">胸围</span><span class="bd-num">${d.chest}cm</span>${prev && prev.chest != null ? diffText(d.chest, prev.chest, 'cm') : ''}</div>` : ''}
                  ${d.waist != null ? `<div class="body-data-value"><span class="bd-label">腰围</span><span class="bd-num">${d.waist}cm</span>${prev && prev.waist != null ? diffText(d.waist, prev.waist, 'cm') : ''}</div>` : ''}
                  ${d.arm != null ? `<div class="body-data-value"><span class="bd-label">臂围</span><span class="bd-num">${d.arm}cm</span>${prev && prev.arm != null ? diffText(d.arm, prev.arm, 'cm') : ''}</div>` : ''}
                </div>
                <button class="btn btn-ghost btn-sm text-danger" data-action="delete-body-data" data-id="${d.id}">删除</button>
              </div>
            `;
          }).join('')
        : `<div class="empty-state"><h3>还没有身体数据</h3><p>点击上方按钮记录第一次数据</p></div>`;

      return `
        <div class="fitness-stats-bar">
          <span>共记录 <strong>${bodyData.length}</strong> 次</span>
          <button class="btn btn-primary btn-sm" data-action="add-body-data">记录数据</button>
        </div>
        <div class="body-data-list">
          ${listHtml}
        </div>
      `;
    };

    container.innerHTML = `
      <div class="page-header">
        <h2>健身计划</h2>
        <p>训练计划、打卡记录和身体数据</p>
      </div>
      <div class="fitness-tabs">
        <button class="fitness-tab ${Pages._fitnessTab === 'plans' ? 'active' : ''}" data-action="switch-tab" data-tab="plans">训练计划</button>
        <button class="fitness-tab ${Pages._fitnessTab === 'body' ? 'active' : ''}" data-action="switch-tab" data-tab="body">身体数据</button>
      </div>
      <div class="fitness-content">
        ${Pages._fitnessTab === 'plans' ? renderPlansTab() : renderBodyDataTab()}
      </div>

      <div class="chart-section">
        <h3 class="chart-section-title">健身统计</h3>
        <div class="chart-grid">
          <div class="chart-card glass-card">
            <div class="chart-card-title">本周训练</div>
            <div style="display: flex; justify-content: center;">
              ${Charts.progressRing({
                value: DataStore.Fitness.getWeekTrainingCount(),
                max: 7,
                size: 120,
                strokeWidth: 10,
                color: 'var(--orange)',
                sublabel: '本周训练次数'
              })}
            </div>
          </div>
          <div class="chart-card glass-card">
            <div class="chart-card-title">训练部位分布</div>
            ${Charts.donutChart({
              data: (() => {
                const weekdays = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
                const partCount = {};
                weekdays.forEach(w => {
                  const plan = DataStore.Fitness.getPlanByWeekday(w);
                  if (plan && plan.exercises) {
                    plan.exercises.forEach(ex => {
                      const part = ex.part || '其他';
                      partCount[part] = (partCount[part] || 0) + 1;
                    });
                  }
                });
                const colors = ['var(--orange)', 'var(--primary)', 'var(--purple)', 'var(--success)', 'var(--danger)', 'var(--warning)'];
                return Object.entries(partCount).map(([label, value], i) => ({
                  label,
                  value,
                  color: colors[i % colors.length]
                }));
              })(),
              size: 120,
              strokeWidth: 20,
              centerLabel: (() => {
                const weekdays = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
                let count = 0;
                weekdays.forEach(w => {
                  const plan = DataStore.Fitness.getPlanByWeekday(w);
                  if (plan && plan.exercises) count += plan.exercises.length;
                });
                return count;
              })(),
              centerSublabel: '总动作数'
            })}
          </div>
        </div>
        <div class="chart-grid" style="margin-top: 16px; grid-template-columns: repeat(4, 1fr);">
          ${Charts.statCard({ label: '本周训练', value: DataStore.Fitness.getWeekTrainingCount() + '次', color: 'var(--orange)', icon: '💪' })}
          ${Charts.statCard({ label: '总训练记录', value: (DataStore.Fitness.getRecords() || []).length + '次', color: 'var(--primary)', icon: '📊' })}
          ${Charts.statCard({ label: '计划动作', value: (() => {
            const weekdays = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
            let count = 0;
            weekdays.forEach(w => {
              const plan = DataStore.Fitness.getPlanByWeekday(w);
              if (plan && plan.exercises) count += plan.exercises.length;
            });
            return count + '个';
          })(), color: 'var(--purple)', icon: '🏋️' })}
          ${Charts.statCard({ label: '身体数据', value: DataStore.Fitness.getBodyData().length + '条', color: 'var(--success)', icon: '📏' })}
        </div>
      </div>
    `;

    // 事件委托
    Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'switch-tab') {
        Pages._fitnessTab = target.dataset.tab;
        Pages.renderFitness(container);
      } else if (action === 'add-exercise') {
        const weekday = target.dataset.weekday;
        const plan = DataStore.Fitness.getOrCreatePlan(weekday);
        const modal = UI.showModal({
          title: `添加动作（${weekdayNames[weekday]}）`,
          body: `
            <div class="form-group"><label>动作名称</label><input type="text" class="input" id="ex-name" placeholder="例如：深蹲" /></div>
            <div class="form-group"><label>训练部位（输入动作名自动识别，也可手动输入）</label><input type="text" class="input" id="ex-part" list="ex-part-options" placeholder="自动识别或手动输入" /><datalist id="ex-part-options"><option value="胸部"></option><option value="背部"></option><option value="肩部"></option><option value="手臂"></option><option value="腿部"></option><option value="臀部"></option><option value="核心"></option><option value="全身"></option></datalist></div>
            <div class="form-row">
              <div class="form-group"><label>组数</label><input type="number" class="input" id="ex-sets" min="1" value="4" /></div>
              <div class="form-group"><label>次数</label><input type="number" class="input" id="ex-reps" min="1" value="10" /></div>
              <div class="form-group"><label>重量(kg)</label><input type="number" class="input" id="ex-weight" min="0" value="0" /></div>
            </div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>添加</button>`
        });
        const addNameInput = modal.root.querySelector('#ex-name');
        const addPartInput = modal.root.querySelector('#ex-part');
        addNameInput.addEventListener('input', () => {
          const g = DataStore.Fitness.guessExercisePart(addNameInput.value);
          if (g) addPartInput.value = g;
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const name = addNameInput.value.trim();
          const part = addPartInput.value.trim();
          const sets = parseInt(modal.root.querySelector('#ex-sets').value) || 0;
          const reps = parseInt(modal.root.querySelector('#ex-reps').value) || 0;
          const weight = parseFloat(modal.root.querySelector('#ex-weight').value) || 0;
          if (name) {

            modal.close();
            Pages.renderFitness(container);
          }

  // 智能识别食物热量（AI）
  async recognizeFoodWithAI(foodName, callback) {
    try {
      const settings = DataStore.AI.getSettings();
      if (!settings.apiKey) {
        callback(null);
        return;
      }

      const prompt = `请识别以下食物的营养成分（每100g），只返回JSON格式，不要其他文字：
食物名称：${foodName}

返回格式：
{"name": "食物名称", "calories": 热量(数字), "protein": 蛋白质(数字), "carbs": 碳水(数字), "fat": 脂肪(数字), "serving": "常见份量"}`;

      const response = await fetch(settings.apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + settings.apiKey
        },
        body: JSON.stringify({
          model: settings.model,
          messages: [
            { role: 'system', content: '你是一个营养学家，只返回JSON格式的食物营养数据，不要其他文字。' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.3
        })
      });

      if (!response.ok) {
        console.error('AI识别失败:', response.status);
        callback(null);
        return;
      }

      const data = await response.json();
      const content = data.choices[0].message.content;

      // 尝试解析JSON
      let result = null;
      try {
        // 提取JSON部分
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          result = JSON.parse(jsonMatch[0]);
        }
      } catch (e) {
        console.error('JSON解析失败:', e);
      }

      callback(result);
    } catch (e) {
      console.error('AI识别出错:', e);
      callback(null);
    }
  },

              if (aiSettings.apiKey && Pages.recognizeFoodWithAI) {
                UI.toast('正在调用AI识别...', 'info');
                Pages.recognizeFoodWithAI(name, (result) => {
                  if (result) {
                    modal.root.querySelector('#meal-servings').value = result.serving || '100g';
                    modal.root.querySelector('#meal-calories').value = result.calories || 0;
                    modal.root.querySelector('#meal-protein').value = result.protein || 0;
                    modal.root.querySelector('#meal-carbs').value = result.carbs || 0;
                    modal.root.querySelector('#meal-fat').value = result.fat || 0;
                    UI.toast('AI识别成功：' + name, 'success');
                  } else {
                    UI.toast('未识别到该食物，请手动输入', 'warning');
                  }
                });
              } else {
                UI.toast('未找到该食物，可手动输入或配置AI后智能识别', 'warning');
              }
            }
          });
        }
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const name = modal.root.querySelector('#meal-name').value.trim();
          if (!name) return;
          const newCalories = parseInt(modal.root.querySelector('#meal-calories').value) || 0;
          DataStore.Diet.addMeal({
            date: Pages._dietDate,
            mealType,
            name,
            servings: modal.root.querySelector('#meal-servings').value.trim(),
            calories: newCalories,
            protein: parseFloat(modal.root.querySelector('#meal-protein').value) || 0,
            carbs: parseFloat(modal.root.querySelector('#meal-carbs').value) || 0,
            fat: parseFloat(modal.root.querySelector('#meal-fat').value) || 0
          });
          modal.close();
          Pages.renderDiet(container);
          // 检查是否超过每日热量目标
          const target = App.state.data.preferences.dailyCalorieTarget || 2000;
          const todayTotal = DataStore.Diet.getDayCalories(Pages._dietDate);
          if (todayTotal > target) {
            UI.showModal({
              title: '热量超标提醒',
              body: `
                <div style="text-align:center;padding:12px 0;">
                  <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
                  <p style="font-size:16px;margin-bottom:8px;">今日摄入热量已超过目标</p>
                  <p style="color:var(--text-secondary);font-size:14px;">
                    目标：${target} kcal<br/>
                    当前：<strong style="color:var(--danger);">${todayTotal} kcal</strong><br/>
                    超出：<strong style="color:var(--danger);">${todayTotal - target} kcal</strong>
                  </p>
                </div>
              `,
              footer: `<button class="btn btn-primary" data-modal-close>知道了</button>`
            });
          }
        });
      } else if (action === 'delete-meal') {
        const id = target.dataset.id;
        UI.confirm({
          title: '删除食物',
          message: '确定要删除这条饮食记录吗？',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            DataStore.Diet.deleteMeal(id);
            Pages.renderDiet(container);
          }
        });
      }
    });
    // 日期输入变化
    const dateInput = container.querySelector('#diet-date');
    if (dateInput) {
      dateInput.addEventListener('change', () => {
        if (dateInput.value) {
          Pages._dietDate = dateInput.value;
          Pages.renderDiet(container);
        }
      });
    }
  },

  // 显示食物热量表弹窗
  showFoodDatabase() {
    if (typeof Pages._foodDbCategory === 'undefined') Pages._foodDbCategory = '全部';
    if (typeof Pages._foodDbKeyword === 'undefined') Pages._foodDbKeyword = '';
    
    const categories = DataStore.Diet.getFoodCategories();
    const foods = DataStore.Diet.searchFood(Pages._foodDbCategory, Pages._foodDbKeyword);
    
    const categoryHtml = categories.map(cat => 
      '<button class="food-cat-btn ' + (Pages._foodDbCategory === cat ? 'active' : '') + '" data-action="food-cat" data-category="' + cat + '">' + cat + '</button>'
    ).join('');
    
    const foodHtml = foods.length > 0 ? foods.map(food => 
      '<div class="food-item">' +
        '<div class="food-item-name">' + food.name + '<span class="food-item-cat">' + food.category + '</span></div>' +
        '<div class="food-item-nutrition">' +
          '<span class="food-calories">' + food.calories + ' kcal</span>' +
          '<span class="food-macro">蛋白' + food.protein + 'g</span>' +
          '<span class="food-macro">碳水' + food.carbs + 'g</span>' +
          '<span class="food-macro">脂肪' + food.fat + 'g</span>' +
          '<span class="food-serving">每100g · ' + food.serving + '</span>' +
        '</div>' +
      '</div>'
    ).join('') : '<div class="food-empty">没有找到相关食物</div>';
    
    const modal = UI.showModal({
      title: '🍎 常见食物热量表',
      body: '<div class="food-db-container">' +
        '<div class="food-search-bar"><input type="text" class="input" id="food-search-input" placeholder="搜索食物..." value="' + Pages._foodDbKeyword + '" /></div>' +
        '<div class="food-categories">' + categoryHtml + '</div>' +
        '<div class="food-list">' + foodHtml + '</div>' +
        '<div class="food-db-footer">共 ' + foods.length + ' 种食物 · 数据仅供参考</div>' +
      '</div>',
      footer: '<button class="btn btn-secondary" data-modal-cancel>关闭</button>',
      wide: true
    });
    
    // 搜索框事件
    const searchInput = modal.root.querySelector('#food-search-input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        Pages._foodDbKeyword = e.target.value;
        modal.close();
        Pages.showFoodDatabase();
      });
    }
    
    // 分类按钮事件
    modal.root.querySelectorAll('.food-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        Pages._foodDbCategory = btn.dataset.category;
        modal.close();
        Pages.showFoodDatabase();
      });
    });
  },

  renderGame(container) {
    // 当前展开的游戏（模块局部变量）
    if (typeof Pages._gameExpandedId === 'undefined') {
      Pages._gameExpandedId = null;
    }

    const games = DataStore.Game.getGames();
    const weekTotal = DataStore.Game.getAllWeekMinutes();

    const renderGameCard = (game) => {
      const totalMin = DataStore.Game.getTotalMinutes(game.id);
      const weekMin = DataStore.Game.getWeekMinutes(game.id);
      const lastPlayed = DataStore.Game.getLastPlayed(game.id);
      const isExpanded = Pages._gameExpandedId === game.id;

      const cardHtml = `
        <div class="game-card ${isExpanded ? 'expanded' : ''}" data-game-id="${game.id}">
          <div class="game-card-header" data-action="toggle-game" data-id="${game.id}">
            <div class="game-card-title">
              <span class="game-name">${Utils.escapeHtml(game.name)}</span>
              ${game.platform ? `<span class="game-platform">${Utils.escapeHtml(game.platform)}</span>` : ''}
            </div>
            <div class="game-card-stats"><span class="game-stat">今日 ${Utils.formatMinutes(DataStore.Game.getDayMinutesForGame(game.id, Utils.todayStr()))}</span><span class="game-stat">本周 ${Utils.formatMinutes(weekMin)}</span><span class="game-stat">总 ${Utils.formatMinutes(totalMin)}</span></div>
          </div>
          <div class="game-card-footer">
            ${lastPlayed ? `<span class="game-last-played">最近: ${Utils.formatDate(lastPlayed)}</span>` : '<span class="game-last-played">未游玩</span>'}
          </div>
        </div>
      `;

      if (!isExpanded) return cardHtml;

      // 展开详情
      const sessions = DataStore.Game.getSessions(game.id).slice(0, 10);


      const sessionsHtml = sessions.length > 0
        ? sessions.map(s => `
            <div class="game-session-item">
              <span class="session-date">${Utils.formatDate(s.date)}</span>
              <span class="session-duration">${Utils.formatMinutes(s.minutes)}</span>
              <button class="btn btn-ghost btn-sm text-danger" data-action="delete-session" data-id="${s.id}">删除</button>
            </div>
          `).join('')
        : `<div class="game-empty">暂无游玩记录</div>`;

      return cardHtml + `
        <div class="game-detail" data-game-id="${game.id}">
          <div class="game-detail-actions">
            <button class="btn btn-primary btn-sm" data-action="start-game" data-id="${game.id}">开始游戏</button>
            <button class="btn btn-secondary btn-sm" data-action="add-session" data-id="${game.id}">记录游玩</button>
            
            <button class="btn btn-ghost btn-sm" data-action="edit-game" data-id="${game.id}">编辑</button>
            <button class="btn btn-ghost btn-sm text-danger" data-action="delete-game" data-id="${game.id}">删除游戏</button>
          </div>

          <div class="game-detail-section">
            <h4>游玩记录（最近10条）</h4>
            <div class="game-session-list">${sessionsHtml}</div>
          </div>
        </div>
      `;
    };

    const gamesHtml = games.length > 0
      ? games.map(renderGameCard).join('')
      : `<div class="empty-state"><h3>还没有游戏</h3><p>点击上方按钮添加你的第一款游戏</p></div>`;

    container.innerHTML = `
      <div class="page-header">
        <h2>游戏娱乐</h2>
        <p>适度游戏，健康生活 · 记录游玩时长，提醒休息</p>
      </div>

      <div class="game-toolbar"><div class="game-week-stat">今日游玩：<strong style="color: var(--primary);">${Utils.formatMinutes(DataStore.Game.getDayMinutes(Utils.todayStr()))}</strong> · 本周：<strong>${Utils.formatMinutes(weekTotal)}</strong> · 每日限制：<strong>${Utils.formatMinutes(App.state.data.preferences.dailyGameTimeLimit || 120)}</strong></div><button class="btn btn-primary" data-action="new-game">添加游戏</button></div>


      <div class="game-grid">
        ${gamesHtml}
      </div>

      <div class="chart-section">
        <h3 class="chart-section-title">游戏统计</h3>
        <div class="chart-grid">
          <div class="chart-card glass-card">
            <div class="chart-card-title">本周游戏时长</div>
            <div style="display: flex; justify-content: center;">
              ${Charts.progressRing({
                value: weekTotal,
                max: (App.state.data.preferences.dailyGameTimeLimit || 120) * 7,
                size: 120,
                strokeWidth: 10,
                color: weekTotal > (App.state.data.preferences.dailyGameTimeLimit || 120) * 7 ? 'var(--danger)' : 'var(--purple)',
                label: Utils.formatMinutes(weekTotal),
                sublabel: '本周时长'
              })}
            </div>
          </div>
          <div class="chart-card glass-card">
            <div class="chart-card-title">游戏时长分布</div>
            ${Charts.donutChart({
              data: games.map((g, i) => ({
                label: g.name,
                value: DataStore.Game.getTotalMinutes(g.id),
                color: ['var(--purple)', 'var(--primary)', 'var(--success)', 'var(--warning)', 'var(--danger)', 'var(--orange)'][i % 6]
              })).filter(d => d.value > 0),
              size: 120,
              strokeWidth: 20,
              centerLabel: Utils.formatMinutes(games.reduce((sum, g) => sum + DataStore.Game.getTotalMinutes(g.id), 0)),
              centerSublabel: '总时长'
            })}
          </div>
        </div>
        <div class="chart-grid" style="margin-top: 16px; grid-template-columns: repeat(4, 1fr);">
          ${Charts.statCard({ label: '今日时长', value: Utils.formatMinutes(DataStore.Game.getDayMinutes(Utils.todayStr())), color: 'var(--primary)', icon: '⏱️' })}
          ${Charts.statCard({ label: '本周时长', value: Utils.formatMinutes(weekTotal), color: 'var(--purple)', icon: '🎮' })}
          ${Charts.statCard({ label: '总时长', value: Utils.formatMinutes(games.reduce((sum, g) => sum + DataStore.Game.getTotalMinutes(g.id), 0)), color: 'var(--success)', icon: '🗓️' })}
          ${Charts.statCard({ label: '日均时长', value: Utils.formatMinutes(Math.round(weekTotal / 7)), color: 'var(--warning)', icon: '📊' })}
        </div>
      </div>
    `;

    // 事件委托
    Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'toggle-game' && id) {
        Pages._gameExpandedId = Pages._gameExpandedId === id ? null : id;
        Pages.renderGame(container);
      } else if (action === 'new-game') {
        const modal = UI.showModal({
          title: '添加游戏',
          body: `
            <div class="form-group"><label>游戏名称</label><input type="text" class="input" id="game-name" placeholder="例如：塞尔达传说" /></div>
            <div class="form-group"><label>平台（可选）</label><input type="text" class="input" id="game-platform" placeholder="例如：Switch / PC / PS5" /></div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>添加</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const name = modal.root.querySelector('#game-name').value.trim();
          const platform = modal.root.querySelector('#game-platform').value.trim();
          if (name) {
            DataStore.Game.addGame({ name, platform });
            modal.close();
            Pages.renderGame(container);
          }
        });
      } else if (action === 'edit-game' && id) {
        const game = App.state.data.game.games.find(g => g.id === id);
        if (!game) return;
        const modal = UI.showModal({
          title: '编辑游戏',
          body: `
            <div class="form-group"><label>游戏名称</label><input type="text" class="input" id="game-name" value="${Utils.escapeHtml(game.name)}" /></div>
            <div class="form-group"><label>平台</label><input type="text" class="input" id="game-platform" value="${Utils.escapeHtml(game.platform || '')}" /></div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>保存</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const name = modal.root.querySelector('#game-name').value.trim();
          const platform = modal.root.querySelector('#game-platform').value.trim();
          if (name) {
            DataStore.Game.updateGame(id, { name, platform });
            modal.close();
            Pages.renderGame(container);
          }
        });
      } else if (action === 'delete-game' && id) {
        UI.confirm({
          title: '删除游戏',
          message: '确定要删除这个游戏吗？相关的游玩记录也会被删除，此操作不可撤销。',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            DataStore.Game.deleteGame(id);
            if (Pages._gameExpandedId === id) Pages._gameExpandedId = null;
            Pages.renderGame(container);
          }
        });
      } else if (action === 'start-game' && id) {
        const game = App.state.data.game.games.find(g => g.id === id);
        if (!game) return;
        Timer.start(`游戏：${game.name}`, (minutes) => {
          DataStore.Game.addSession(id, { date: Utils.todayStr(), minutes });
          UI.toast(`已记录游玩 ${Utils.formatMinutes(minutes)}`, 'success');
          Pages.renderGame(container);
          // 检查是否超过每日游戏时间限制
          const limit = App.state.data.preferences.dailyGameTimeLimit || 120;
          const todayTotal = DataStore.Game.getDayMinutes(Utils.todayStr());
          if (todayTotal > limit) {
            UI.showModal({
              title: '游戏时间超限提醒',
              body: `
                <div style="text-align:center;padding:12px 0;">
                  <div style="font-size:48px;margin-bottom:12px;">🎮</div>
                  <p style="font-size:16px;margin-bottom:8px;">今日游戏时间已超过限制</p>
                  <p style="color:var(--text-secondary);font-size:14px;">
                    限制：${limit} 分钟（${Utils.formatMinutes(limit)}）<br/>
                    当前：<strong style="color:var(--danger);">${todayTotal} 分钟（${Utils.formatMinutes(todayTotal)}）</strong><br/>
                    超出：<strong style="color:var(--danger);">${todayTotal - limit} 分钟（${Utils.formatMinutes(todayTotal - limit)}）</strong>
                  </p>
                  <p style="color:var(--text-secondary);font-size:13px;margin-top:12px;">适当休息，保护眼睛和颈椎</p>
                </div>
              `,
              footer: `<button class="btn btn-primary" data-modal-close>知道了</button>`
            });
          }
        });
      } else if (action === 'add-session' && id) {
        const modal = UI.showModal({
          title: '记录游玩',
          body: `
            <div class="form-group"><label>日期</label><input type="date" class="input" id="session-date" value="${Utils.todayStr()}" /></div>
            <div class="form-group"><label>游玩时长（分钟）</label><input type="number" class="input" id="session-minutes" min="1" placeholder="例如：120" /></div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>保存</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const date = modal.root.querySelector('#session-date').value;
          const minutes = parseInt(modal.root.querySelector('#session-minutes').value);
          if (date && minutes > 0) {
            DataStore.Game.addSession(id, { date, minutes });
            modal.close();
            Pages.renderGame(container);
            // 检查是否超过每日游戏时间限制
            const limit = App.state.data.preferences.dailyGameTimeLimit || 120;
            const todayTotal = DataStore.Game.getDayMinutes(date);
            if (todayTotal > limit) {
              UI.showModal({
                title: '游戏时间超限提醒',
                body: `
                  <div style="text-align:center;padding:12px 0;">
                    <div style="font-size:48px;margin-bottom:12px;">🎮</div>
                    <p style="font-size:16px;margin-bottom:8px;">今日游戏时间已超过限制</p>
                    <p style="color:var(--text-secondary);font-size:14px;">
                      限制：${limit} 分钟（${Utils.formatMinutes(limit)}）<br/>
                      当前：<strong style="color:var(--danger);">${todayTotal} 分钟（${Utils.formatMinutes(todayTotal)}）</strong><br/>
                      超出：<strong style="color:var(--danger);">${todayTotal - limit} 分钟（${Utils.formatMinutes(todayTotal - limit)}）</strong>
                    </p>
                    <p style="color:var(--text-secondary);font-size:13px;margin-top:12px;">适当休息，保护眼睛和颈椎</p>
                  </div>
                `,
                footer: `<button class="btn btn-primary" data-modal-close>知道了</button>`
              });
            }
          }
        });
      } else if (action === 'delete-session' && id) {
        DataStore.Game.deleteSession(id);
        Pages.renderGame(container);
      }
    });
  },

    container.querySelectorAll('[data-action="ai-select-conv"]').forEach(el => {

      });

    container.querySelectorAll('[data-action="ai-delete-conv"]').forEach(el => {

            }
            Pages.renderAI(container);
          }
        });
      });
    });

    container.querySelectorAll('[data-action="ai-suggestion"]').forEach(el => {
      el.addEventListener('click', () => {
        const input = container.querySelector('#ai-input');
        input.value = el.dataset.text;
        this.sendAIMessage(container);
      });
    });

    // 发送按钮
    container.querySelector('[data-action="ai-send"]').addEventListener('click', () => {
      this.sendAIMessage(container);
    });

    // 输入框回车发送
    const input = container.querySelector('#ai-input');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.sendAIMessage(container);
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    // 滚动到底部
    const messagesEl = container.querySelector('#ai-messages');
    messagesEl.scrollTop = messagesEl.scrollHeight;

  renderAIMessage(msg) {
    if (msg.role === 'user') {
      return `
        <div class="ai-message ai-user-message">
          <div class="ai-message-avatar user">我</div>
          <div class="ai-message-content">${Utils.escapeHtml(msg.content)}</div>
        </div>
      `;
    } else if (msg.role === 'assistant') {
      let content = msg.content || '';
      if (msg.toolCalls && msg.toolCalls.length > 0) {
        content += '\n\n' + msg.toolCalls.map(tc => `[执行工具：${tc.function.name}]`).join('\n');
      }
      return `
        <div class="ai-message ai-assistant-message">
          <div class="ai-message-avatar assistant">AI</div>
          <div class="ai-message-content">${Utils.escapeHtml(content).replace(/\n/g, '<br>')}</div>
        </div>
      `;
    } else if (msg.role === 'tool') {
      return `
        <div class="ai-message ai-tool-message">
          <div class="ai-message-avatar tool">🔧</div>
          <div class="ai-message-content"><strong>工具结果：</strong><br>${Utils.escapeHtml(msg.content)}</div>
        </div>
      `;
    }
    return '';
  },

  async sendAIMessage(container) {
    const input = container.querySelector('#ai-input');
    const text = input.value.trim();
    if (!text) return;

    // 获取或创建对话
    let convId = Pages._aiCurrentConvId;
    let conv = convId ? DataStore.AI.getConversation(convId) : null;
    if (!conv) {
      conv = DataStore.AI.createConversation(text.slice(0, 20));
      convId = conv.id;
      Pages._aiCurrentConvId = convId;
    }

    // 添加用户消息
    DataStore.AI.addMessage(convId, 'user', text);
    input.value = '';
    input.style.height = 'auto';

    // 重新渲染显示用户消息
    Pages.renderAI(container);

    const messagesEl = container.querySelector('#ai-messages');

    // 显示加载中
    const loadingEl = document.createElement('div');
    loadingEl.className = 'ai-message ai-assistant-message';
    loadingEl.innerHTML = `
      <div class="ai-message-avatar assistant">AI</div>
      <div class="ai-message-content ai-loading">
        <span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span>
      </div>
    `;
    messagesEl.appendChild(loadingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      // 准备消息历史
      const convData = DataStore.AI.getConversation(convId);
      const history = convData.messages.map(m => ({
        role: m.role,
        content: m.content
      }));

      let fullContent = '';
      const result = await AIClient.chatWithTools(history, (chunk, done) => {
        if (!done && chunk) {
          fullContent += chunk;
          const contentEl = loadingEl.querySelector('.ai-message-content');
          if (contentEl) {
            contentEl.classList.remove('ai-loading');
            contentEl.innerHTML = Utils.escapeHtml(fullContent).replace(/\n/g, '<br>');
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      });

      // 移除加载元素
      loadingEl.remove();

      // 添加AI回复
      if (result.content) {
        DataStore.AI.addMessage(convId, 'assistant', result.content, result.tool_calls);
      }

      // 更新对话标题（如果是第一条消息）
      if (convData.messages.length <= 2 && text) {
        DataStore.AI.updateConversationTitle(convId, text.slice(0, 20));
      }

      Pages.renderAI(container);
    } catch (e) {
      loadingEl.remove();
      UI.toast(e.message || 'AI请求失败', 'error');
      const errorEl = document.createElement('div');
      errorEl.className = 'ai-message ai-error-message';
      errorEl.innerHTML = `
        <div class="ai-message-avatar assistant">AI</div>
        <div class="ai-message-content" style="color:var(--danger);">请求失败：${Utils.escapeHtml(e.message)}</div>
      `;
      messagesEl.appendChild(errorEl);
    }
  },

          UI.toast('已获取当前位置', 'success');

          useLocationBtn.textContent = '使用当前定位';
          UI.toast('定位失败：' + (err.message || '请检查权限'), 'error');
        });
      });
    }

    const summaryCheckboxes = [
      { id: 'pref-summary-study', module: 'study' },
      { id: 'pref-summary-fitness', module: 'fitness' },
      { id: 'pref-summary-diet', module: 'diet' },
      { id: 'pref-summary-game', module: 'game' }
    ];

    summaryCheckboxes.forEach(({ id, module }) => {
      const cb = container.querySelector(`#${id}`);
      if (cb) {
        cb.addEventListener('change', () => {
          let current = [...(App.state.data.preferences.homeSummaryModules || [])];
          if (cb.checked) {
            if (!current.includes(module)) current.push(module);
          } else {
            current = current.filter(m => m !== module);
          }
          DataStore.Preferences.update({ homeSummaryModules: current });
          UI.toast('已保存', 'success');
        });
      }
    });

    // 悬浮球设置（仅Electron环境）
    if (Storage.isElectron && window.electronAPI) {
      const showFloatBallCb = container.querySelector('#pref-show-float-ball');
      if (showFloatBallCb) {
        showFloatBallCb.addEventListener('change', () => {
          DataStore.Preferences.update({ showFloatBall: showFloatBallCb.checked });
          if (showFloatBallCb.checked) {
            window.electronAPI.showFloatBall();
          } else {
            window.electronAPI.hideFloatBall();
          }
          UI.toast('已保存', 'success');
        });
      }
      const opacitySlider = container.querySelector('#pref-float-ball-opacity');
      const opacityValue = container.querySelector('#pref-float-ball-opacity-value');
      if (opacitySlider && opacityValue) {
        opacitySlider.addEventListener('input', () => {
          const val = parseInt(opacitySlider.value);
          opacityValue.textContent = val + '%';
          opacitySlider.style.setProperty('--fill', Math.round((val-20)/80*100) + '%');
          DataStore.Preferences.update({ floatBallOpacity: val });
          window.electronAPI.setFloatBallOpacity(val);
        });
        opacitySlider.addEventListener('change', () => {
          UI.toast('已保存', 'success');
        });
      }
    }
  },

  // ===== 日程日历页面 =====
  renderCalendar(container) {
    if (typeof Pages._calendarView === 'undefined') Pages._calendarView = 'month';
    if (typeof Pages._calendarYear === 'undefined') {
      const now = new Date();
      Pages._calendarYear = now.getFullYear();
      Pages._calendarMonth = now.getMonth();
      Pages._calendarSelectedDate = Utils.todayStr();
    }
    const year = Pages._calendarYear;
    const month = Pages._calendarMonth;
    const selectedDate = Pages._calendarSelectedDate;
    const today = Utils.todayStr();
    const moduleEvents = DataStore.Calendar.syncFromModules();
    const customEvents = DataStore.Calendar.getMonthView(year, month);
    const allEvents = [...moduleEvents, ...customEvents];
    const eventsByDate = {};
    allEvents.forEach(e => { if (!eventsByDate[e.date]) eventsByDate[e.date] = []; eventsByDate[e.date].push(e); });
    const specialByDate = {};
    Object.keys(DataStore.Calendar.HOLIDAYS).forEach(d => { specialByDate[d] = { label: DataStore.Calendar.HOLIDAYS[d], builtin: true }; });
    (App.state.data.calendar.specialDates||[]).forEach(s => { specialByDate[s.date] = { label: s.label, builtin: false, id: s.id }; });
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = firstDay.getDay();
    const daysInMonth = lastDay.getDate();
    const weekStart = App.state.data.preferences.weekStartDay === 'monday' ? 1 : 0;
    const adjustedStart = (startWeekday - weekStart + 7) % 7;
    const weekdayNames = weekStart === 1 ? ['一','二','三','四','五','六','日'] : ['日','一','二','三','四','五','六'];
    let cells = [];
    for (let i = 0; i < adjustedStart; i++) cells.push({ day: null, date: null });
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');

          modal.root.querySelector('[data-modal-delete]').addEventListener('click', () => { if (confirm('确定要删除这门课程吗？')) { DataStore.Calendar.deleteCourse(courseId); modal.close(); UI.toast('课程已删除', 'success'); Pages.renderCalendar(container); } });

// ===== 习惯打卡页面 =====
  renderHabits(container) {
    const allHabits = DataStore.Habits.getHabits();
    const today = Utils.todayStr();
    const todayProgress = DataStore.Habits.getTodayProgress();
    const categories = ['全部', '健康', '学习', '工作', '生活', '其他'];
    
    // 初始化筛选状态
    if (typeof Pages._habitsCategory === 'undefined') Pages._habitsCategory = '全部';
    if (typeof Pages._expandedHabit === 'undefined') Pages._expandedHabit = null;
    if (typeof Pages._habitsCalYear === 'undefined') {
      const now = new Date();
      Pages._habitsCalYear = now.getFullYear();
      Pages._habitsCalMonth = now.getMonth();
    }
    
    // 按分类筛选
    let habits = Pages._habitsCategory === '全部' ? allHabits : allHabits.filter(h => (h.category || '其他') === Pages._habitsCategory);
    
    // 智能排序：已打卡在前，按连续打卡天数降序
    habits = habits.sort((a, b) => {
      const aChecked = DataStore.Habits.isChecked(a.id, today);
      const bChecked = DataStore.Habits.isChecked(b.id, today);
      if (aChecked !== bChecked) return bChecked - aChecked;
      return DataStore.Habits.getStreak(b.id) - DataStore.Habits.getStreak(a.id);
    });
    
    // 统计数据
    const totalCheckins = allHabits.reduce((sum, h) => sum + DataStore.Habits.getTotalCheckins(h.id), 0);
    const avgStreak = allHabits.length > 0 ? Math.round(allHabits.reduce((sum, h) => sum + DataStore.Habits.getStreak(h.id), 0) / allHabits.length) : 0;
    const weekTotal = allHabits.reduce((sum, h) => sum + DataStore.Habits.getWeekCheckins(h.id), 0);
    
    // 分类标签HTML
    const categoryHtml = '<div class="habits-categories">' + categories.map(cat => 
      '<button class="habit-category-btn ' + (Pages._habitsCategory === cat ? 'active' : '') + '" data-action="filter-category" data-category="' + cat + '">' + cat + '</button>'
    ).join('') + '</div>';
    
    // 习惯卡片HTML
    const habitsHtml = habits.length > 0 ? habits.map(habit => {
      const isChecked = DataStore.Habits.isChecked(habit.id, today);
      const streak = DataStore.Habits.getStreak(habit.id);
      const longestStreak = DataStore.Habits.getLongestStreak(habit.id);
      const weekCheckins = DataStore.Habits.getWeekCheckins(habit.id);
      const totalCheckin = DataStore.Habits.getTotalCheckins(habit.id);
      const weeklyTarget = habit.weeklyTarget || 7;
      const weekPercent = Math.min(100, Math.round((weekCheckins / weeklyTarget) * 100));
      const isExpanded = Pages._expandedHabit === habit.id;
      const habitColor = habit.color || '#0A84FF';
      
      // 打卡日历
      let calendarHtml = '';
      if (isExpanded) {
        const calDays = DataStore.Habits.getMonthCalendar(habit.id, Pages._habitsCalYear, Pages._habitsCalMonth);
        calendarHtml = '<div class="habit-calendar"><div class="habit-calendar-header"><button class="btn btn-ghost btn-xs" data-action="cal-prev" data-id="' + habit.id + '">←</button><span>' + Pages._habitsCalYear + '年' + (Pages._habitsCalMonth + 1) + '月</span><button class="btn btn-ghost btn-xs" data-action="cal-next" data-id="' + habit.id + '">→</button></div><div class="habit-calendar-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="habit-calendar-grid">' + calDays.map(d => {
          if (!d.day) return '<div class="habit-cal-day empty"></div>';
          return '<div class="habit-cal-day ' + (d.checked ? 'checked' : '') + '" style="' + (d.checked ? 'background:' + habitColor + ';' : '') + '" title="' + d.date + '">' + d.day + '</div>';
        }).join('') + '</div></div>';
      }
      
      return '<div class="habit-card card ' + (isChecked ? 'checked' : '') + '" data-id="' + habit.id + '" style="border-left: 3px solid ' + habitColor + ';">' +
        '<div class="habit-main" data-action="toggle-expand" data-id="' + habit.id + '">' +
          '<div class="habit-check ' + (isChecked ? 'checked' : '') + '" data-action="toggle-check" data-id="' + habit.id + '" style="' + (isChecked ? 'background:' + habitColor + ';' : '') + '">' + (isChecked ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '') + '</div>' +
          '<div class="habit-info">' +
            '<div class="habit-name"><span class="habit-icon">' + habit.icon + '</span><span>' + Utils.escapeHtml(habit.name) + '</span>' + (habit.category ? '<span class="habit-category-tag">' + (habit.category || '其他') + '</span>' : '') + '</div>' +
            '<div class="habit-stats">' +
              '<span class="habit-stat">🔥 连续 ' + streak + ' 天</span>' +

    // 统计卡片

      Charts.statCard({ label: '累计打卡', value: totalCheckins + '次', color: 'var(--warning)', icon: '🔥' }) +
      Charts.statCard({ label: '平均连续', value: avgStreak + '天', color: 'var(--purple)', icon: '🏆' }) +
    '</div></div>' : '';
    
    container.innerHTML = '<div class="page-header"><h2>习惯打卡</h2><p>培养好习惯，每天进步一点点</p></div>' +
      '<div class="habits-progress-bar card"><div class="habits-progress-info"><span class="habits-progress-label">今日打卡进度</span><span class="habits-progress-count">' + todayProgress.checked + '/' + todayProgress.total + '</span></div><div class="progress-bar large"><div class="progress-fill" style="width:' + todayProgress.percent + '%"></div></div></div>' +
      '<div class="habits-toolbar">' + categoryHtml + '<button class="btn btn-primary" data-action="add-habit">+ 添加习惯</button></div>' +
      '<div class="habits-list">' + habitsHtml + '</div>' + statsHtml;
    
    // 事件监听器（每次渲染重新绑定，避免页面切换后监听器被移除）
      Pages.bindClick(container, (e) => {

        if (action === 'toggle-check' && id) {

          if (isChecked) { DataStore.Habits.uncheck(id, Utils.todayStr()); UI.toast('已取消打卡', 'default'); }
          else { DataStore.Habits.checkin(id, Utils.todayStr()); UI.toast('打卡成功！继续保持', 'success'); }

        } else if (action === 'filter-category') {
          Pages._habitsCategory = target.dataset.category;

  },
// ===== 理财记账页面 =====
  renderFinance(container) {
    if (typeof Pages._financeYear === 'undefined') {
      const now = new Date();
      Pages._financeYear = now.getFullYear();
      Pages._financeMonth = now.getMonth();
    }
    const year = Pages._financeYear;
    const month = Pages._financeMonth;
    const summary = DataStore.Finance.getMonthSummary(year, month);
    const transactions = DataStore.Finance.getMonthTransactions(year, month);
    const categories = DataStore.Finance.getCategories();
    const todaySummary = DataStore.Finance.getTodaySummary();

    // 按日期分组
    const byDate = {};
    transactions.forEach(t => {
      if (!byDate[t.date]) byDate[t.date] = [];
      byDate[t.date].push(t);
    });
    const sortedDates = Object.keys(byDate).sort((a, b) => new Date(b) - new Date(a));

    // 分类支出排行
    const categoryEntries = Object.entries(summary.categoryExpense).sort((a, b) => b[1] - a[1]);
    const maxCategory = categoryEntries.length > 0 ? categoryEntries[0][1] : 1;

      '<div class="finance-summary-grid">' +
      '<div class="finance-summary-card card income"><div class="finance-summary-label">本月收入</div><div class="finance-summary-value">¥' + summary.income.toFixed(2) + '</div></div>' +
      '<div class="finance-summary-card card expense"><div class="finance-summary-label">本月支出</div><div class="finance-summary-value">¥' + summary.expense.toFixed(2) + '</div></div>' +
      '<div class="finance-summary-card card balance"><div class="finance-summary-label">本月结余</div><div class="finance-summary-value ' + (summary.balance >= 0 ? 'positive' : 'negative') + '">¥' + summary.balance.toFixed(2) + '</div></div>' +
      '<div class="finance-summary-card card today"><div class="finance-summary-label">今日支出</div><div class="finance-summary-value">¥' + todaySummary.expense.toFixed(2) + '</div></div>' +
      '</div>' +
      '<div class="finance-layout"><div class="finance-transactions card"><h3 class="finance-section-title">交易记录 (' + summary.count + '笔)</h3>' +
      (sortedDates.length > 0 ? sortedDates.map(date => {
        const dayTransactions = byDate[date];
        const dayIncome = dayTransactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const dayExpense = dayTransactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        return '<div class="finance-date-group"><div class="finance-date-header"><span>' + Utils.formatDate(date) + '</span><span class="finance-date-summary">' + (dayIncome > 0 ? '收 ¥' + dayIncome.toFixed(2) + ' ' : '') + (dayExpense > 0 ? '支 ¥' + dayExpense.toFixed(2) : '') + '</span></div>' +
          dayTransactions.map(t => '<div class="finance-transaction-item" data-id="' + t.id + '"><div class="finance-transaction-left"><div class="finance-transaction-category">' + t.category + '</div>' + (t.note ? '<div class="finance-transaction-note">' + Utils.escapeHtml(t.note) + '</div>' : '') + '</div><div class="finance-transaction-right"><span class="finance-transaction-amount ' + t.type + '">' + (t.type === 'income' ? '+' : '-') + '¥' + t.amount.toFixed(2) + '</span><button class="btn btn-ghost btn-xs" data-action="delete-transaction" data-id="' + t.id + '">删除</button></div></div>').join('') +
          '</div>';
      }).join('') : '<div class="empty-state"><p>本月还没有交易记录</p><p>点击右上角"记一笔"开始记账</p></div>') +
      '</div>' +
      '<div class="finance-stats card"><h3 class="finance-section-title">支出分类</h3>' +
      (categoryEntries.length > 0 ? categoryEntries.map(([cat, amount]) => {
        const percent = (amount / summary.expense * 100).toFixed(1);
        return '<div class="finance-category-item"><div class="finance-category-header"><span class="finance-category-name">' + cat + '</span><span class="finance-category-amount">¥' + amount.toFixed(2) + ' (' + percent + '%)</span></div><div class="finance-category-bar"><div class="finance-category-fill" style="width:' + (amount / maxCategory * 100) + '%"></div></div></div>';
      }).join('') : '<div class="empty-state"><p>暂无支出数据</p></div>') +
      '</div></div>';

        Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'prev-month') { Pages._financeMonth--; if (Pages._financeMonth < 0) { Pages._financeMonth = 11; Pages._financeYear--; } Pages.renderFinance(container); }
      else if (action === 'next-month') { Pages._financeMonth++; if (Pages._financeMonth > 11) { Pages._financeMonth = 0; Pages._financeYear++; } Pages.renderFinance(container); }
      else if (action === 'add-transaction') {
        const cats = DataStore.Finance.getCategories(); const categoryOptions = cats.map(c => '<option value="' + c + '">' + c + '</option>').join('');
        const modal = UI.showModal({
          title: '记一笔',
          body: '<div class="form-group"><label>类型</label><div class="finance-type-toggle"><button class="btn btn-sm finance-type-btn active" data-type="expense">支出</button><button class="btn btn-sm finance-type-btn" data-type="income">收入</button></div></div><div class="form-group"><label>金额 *</label><input type="number" class="input" id="trans-amount" placeholder="0.00" step="0.01" min="0" /></div><div class="form-row"><div class="form-group"><label>分类</label><select class="select" id="trans-category">' + categoryOptions + '</select></div><div class="form-group"><label>日期</label><input type="date" class="input" id="trans-date" value="' + Utils.todayStr() + '" /></div></div><div class="form-group"><label>备注</label><input type="text" class="input" id="trans-note" placeholder="可选" /></div>',
          footer: '<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>保存</button>'
        });
        let currentType = 'expense';
        modal.root.querySelectorAll('.finance-type-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            modal.root.querySelectorAll('.finance-type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = btn.dataset.type;
          });
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const amount = parseFloat(modal.root.querySelector('#trans-amount').value);
          if (!amount || amount <= 0) { UI.toast('请输入有效金额', 'error'); return; }
          DataStore.Finance.addTransaction({

      } else if (action === 'delete-transaction') {
        const id = target.dataset.id;

    });
  }

};



/* ===== 应用初始化 ===== */
App.init = async function() {
  Router.init();
  Theme.init();

  // 尝试连接数据文件
  const connected = await Storage.init();

  // 更新文件名显示
  const fileEl = document.getElementById('file-name');
  if (fileEl) fileEl.textContent = Storage.getFileName();

  if (connected) {
    // 已连接文件，直接渲染页面
    Router.renderPage();
  } else {
    // 未连接文件，显示首次使用引导
    // 页面内容区先显示空白，引导完成后再渲染
    const content = document.getElementById('page-content');
    if (content) content.innerHTML = '';
    Welcome.show();
  }
};


/* ===== 全局AI助手悬浮按钮 ===== */
const FloatAI = {
  isDragging: false,
  hasMoved: false,
  startX: 0,
  startY: 0,
  startLeft: 0,
  startTop: 0,
  modalDragging: false,
  modalStartX: 0,
  modalStartY: 0,
  modalStartLeft: 0,
  modalStartTop: 0,

  init() {
    const btn = document.getElementById('ai-float-btn');
    const modal = document.getElementById('ai-float-modal');
    if (!btn || !modal) return;

    // 恢复保存的位置
    const savedPos = localStorage.getItem('ai-float-btn-pos');
    if (savedPos) {
      try {
        const pos = JSON.parse(savedPos);
        btn.style.left = pos.left + 'px';
        btn.style.top = pos.top + 'px';
        btn.style.right = 'auto';
        btn.style.bottom = 'auto';
      } catch (e) {}
    }

    // 按钮拖动
    btn.addEventListener('mousedown', (e) => this.startDrag(e, btn));
    document.addEventListener('mousemove', (e) => this.onDrag(e, btn));
    document.addEventListener('mouseup', (e) => this.endDrag(e, btn, modal));

    // 弹窗关闭按钮
    document.getElementById('ai-float-close').addEventListener('click', () => {
      modal.classList.remove('show');
    });

    // 弹窗最小化按钮
    document.getElementById('ai-float-minimize').addEventListener('click', () => {
      modal.classList.remove('show');
    });

    // 弹窗拖动
    const header = modal.querySelector('.ai-float-header');
    header.addEventListener('mousedown', (e) => this.startModalDrag(e, modal));
    document.addEventListener('mousemove', (e) => this.onModalDrag(e, modal));
    document.addEventListener('mouseup', () => this.endModalDrag(modal));

    // 发送消息
    document.getElementById('ai-float-send').addEventListener('click', () => this.sendMessage());
    document.getElementById('ai-float-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.sendMessage();
      }
    });

    // 建议按钮
    document.querySelectorAll('.ai-float-suggestion').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.dataset.text;
        document.getElementById('ai-float-input').value = text;
        this.sendMessage();
      });
    });

    // 自动调整输入框高度
    const input = document.getElementById('ai-float-input');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });
  },

  startDrag(e, btn) {
    this.isDragging = true;
    this.hasMoved = false;
    this.startX = e.clientX;
    this.startY = e.clientY;
    const rect = btn.getBoundingClientRect();
    this.startLeft = rect.left;
    this.startTop = rect.top;
    btn.style.right = 'auto';
    btn.style.bottom = 'auto';
  },

  onDrag(e, btn) {
    if (!this.isDragging) return;
    const dx = e.clientX - this.startX;
    const dy = e.clientY - this.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this.hasMoved = true;
    let newLeft = this.startLeft + dx;
    let newTop = this.startTop + dy;
    // 限制在视口内
    newLeft = Math.max(0, Math.min(window.innerWidth - 56, newLeft));
    newTop = Math.max(0, Math.min(window.innerHeight - 56, newTop));
    btn.style.left = newLeft + 'px';
    btn.style.top = newTop + 'px';
  },

  endDrag(e, btn, modal) {
    if (!this.isDragging) return;
    this.isDragging = false;
    // 保存位置
    const rect = btn.getBoundingClientRect();
    localStorage.setItem('ai-float-btn-pos', JSON.stringify({ left: rect.left, top: rect.top }));
    // 如果没有拖动，视为点击
    if (!this.hasMoved) {
      modal.classList.toggle('show');
      if (modal.classList.contains('show')) {
        // 定位弹窗在按钮上方
        const btnRect = btn.getBoundingClientRect();
        modal.style.right = 'auto';
        modal.style.bottom = 'auto';
        let modalLeft = btnRect.left - 380 + 56;
        let modalTop = btnRect.top - 530;
        if (modalLeft < 10) modalLeft = 10;
        if (modalTop < 10) modalTop = 10;
        modal.style.left = modalLeft + 'px';
        modal.style.top = modalTop + 'px';
        // 聚焦输入框
        setTimeout(() => document.getElementById('ai-float-input').focus(), 100);
      }
    }
  },

  startModalDrag(e, modal) {
    if (e.target.tagName === 'BUTTON') return;
    this.modalDragging = true;
    this.modalStartX = e.clientX;
    this.modalStartY = e.clientY;
    const rect = modal.getBoundingClientRect();
    this.modalStartLeft = rect.left;
    this.modalStartTop = rect.top;
  },

  onModalDrag(e, modal) {
    if (!this.modalDragging) return;
    const dx = e.clientX - this.modalStartX;
    const dy = e.clientY - this.modalStartY;
    let newLeft = this.modalStartLeft + dx;
    let newTop = this.modalStartTop + dy;
    newLeft = Math.max(0, Math.min(window.innerWidth - 380, newLeft));
    newTop = Math.max(0, Math.min(window.innerHeight - 100, newTop));
    modal.style.left = newLeft + 'px';
    modal.style.top = newTop + 'px';
    modal.style.right = 'auto';
    modal.style.bottom = 'auto';
  },

  endModalDrag(modal) {
    this.modalDragging = false;
  },

  async sendMessage() {
    const input = document.getElementById('ai-float-input');
    const sendBtn = document.getElementById('ai-float-send');
    const messagesEl = document.getElementById('ai-float-messages');
    const text = input.value.trim();
    if (!text) return;

    // 移除欢迎界面
    const welcome = messagesEl.querySelector('.ai-float-welcome');
    if (welcome) welcome.remove();

    // 添加用户消息
    const userMsg = document.createElement('div');
    userMsg.className = 'ai-float-msg user';
    userMsg.textContent = text;
    messagesEl.appendChild(userMsg);

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // 添加加载动画
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'ai-float-msg assistant loading';
    loadingMsg.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(loadingMsg);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      // 检查API配置
      const settings = DataStore.AI.getSettings();
      if (!settings.apiKey) {
        loadingMsg.className = 'ai-float-msg assistant';
        loadingMsg.textContent = '请先在"数据与设置"页面配置AI API Key，然后就可以和我对话了。';
        messagesEl.scrollTop = messagesEl.scrollHeight;
        sendBtn.disabled = false;
        return;
      }

      // 调用AI
      const history = [{ role: 'user', content: text }];
      const response = await AIClient.chatWithTools(history, (chunk, done) => {
        if (chunk && chunk.content) {
          loadingMsg.textContent = chunk.content;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      });

      loadingMsg.className = 'ai-float-msg assistant';
      loadingMsg.textContent = response || '抱歉，我没有理解你的意思。';
    } catch (err) {
      loadingMsg.className = 'ai-float-msg assistant';
      loadingMsg.textContent = '出错了：' + err.message;
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    sendBtn.disabled = false;
  }
};

// 在应用初始化后启动悬浮AI
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => FloatAI.init(), 500);
});

// 启动应用
if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => App.init());
}

// 导出供测试使用（Node.js 环境）
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { Utils, App, Storage, UI, Timer, Welcome, Router, Pages, DataStore, IDB, Theme, AIClient, Charts, FloatAI };
