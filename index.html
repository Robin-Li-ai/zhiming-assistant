  // 发送聊天请求（非流式）
  async chat(messages, onStream) {
    const settings = DataStore.AI.getSettings();
    if (!settings.apiKey) {
      throw new Error('请先在设置中配置API Key');
    }

    const systemMsg = { role: 'system', content: this.getSystemPrompt() };
    const allMessages = [systemMsg, ...messages];

    const body = {
      model: settings.model,
      messages: allMessages,
      tools: this.getTools(),
      tool_choice: 'auto'
    };

    if (onStream) {
      body.stream = true;
    }

    const response = await fetch(settings.apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${settings.apiKey}`
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API请求失败：${response.status} ${errText}`);
    }

    if (onStream) {
      return this.handleStream(response, onStream);
    } else {
      const data = await response.json();
      return data.choices[0].message;
    }
  },

  // 处理流式响应
  async handleStream(response, onChunk) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let toolCalls = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value);
      const lines = chunk.split('\n').filter(line => line.trim() !== '');

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const dataStr = line.slice(6);
          if (dataStr === '[DONE]') continue;

          try {
            const data = JSON.parse(dataStr);
            const delta = data.choices[0].delta;

            if (delta.content) {
              fullContent += delta.content;
              onChunk(delta.content, false);
            }

            if (delta.tool_calls) {
              for (const tc of delta.tool_calls) {
                if (tc.index !== undefined && !toolCalls[tc.index]) {
                  toolCalls[tc.index] = { id: tc.id, type: 'function', function: { name: '', arguments: '' } };
                }
                if (tc.index !== undefined) {
                  if (tc.function?.name) toolCalls[tc.index].function.name += tc.function.name;
                  if (tc.function?.arguments) toolCalls[tc.index].function.arguments += tc.function.arguments;
                }
              }
            }
          } catch (e) {
            // 忽略解析错误
          }
        }
      }
    }

    onChunk('', true);
    return { content: fullContent, tool_calls: toolCalls.length > 0 ? toolCalls : null };
  },

  // 处理工具调用并继续对话
    async chatWithTools(messages, onStream) {
    let currentMessages = [...messages];
    let finalResult = null;
    const maxRounds = 5; // 最多5轮工具调用，防止死循环

    for (let round = 0; round < maxRounds; round++) {
      const result = await this.chat(currentMessages, onStream);
      finalResult = result;

      if (!result.tool_calls || result.tool_calls.length === 0) {
        break; // 没有工具调用了，返回最终结果
      }

      // 执行工具
      const toolResults = [];
      for (const tc of result.tool_calls) {
        let args = {};
        try { args = JSON.parse(tc.function.arguments); } catch (e) {}
        const toolResult = this.executeTool(tc.function.name, args);
        toolResults.push({
          role: 'tool',
          tool_call_id: tc.id,
          content: toolResult
        });
        if (onStream) {
          onStream(`\n\n[执行工具：${tc.function.name}]\n`, false);
        }
      }

      // 将助手回复和工具结果加入消息，继续下一轮
      currentMessages = [
        ...currentMessages,
        { role: 'assistant', content: result.content || '', tool_calls: result.tool_calls },
        ...toolResults
      ];
    }

    // 如果最后一轮还是只有工具调用没有文字，给一个默认回复
    if (!finalResult.content && finalResult.tool_calls && finalResult.tool_calls.length > 0) {
      finalResult.content = '已为你查询相关数据。根据你的记录，建议保持规律作息和均衡饮食，继续坚持锻炼！如有具体问题可以继续问我。';
    }

    return finalResult;
  }
};

/* ===== 通用 UI 组件 ===== */
const UI = {
  toast(message, type = 'default', duration = 3000) {
    const root = document.getElementById('toast-root');
    if (!root) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    root.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.2s';
      setTimeout(() => el.remove(), 200);
    }, duration);
  },

  showModal({ title, body, footer, onClose }) {
    const root = document.getElementById('modal-root');
    if (!root) return;
    root.innerHTML = `
      <div class="modal-overlay"></div>
      <div class="modal-container">
        <div class="modal-header">
          <h3>${Utils.escapeHtml(title)}</h3>
          <button class="modal-close" data-modal-close>&times;</button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
      </div>
    `;
    root.classList.add('active');

    const close = () => {
      root.classList.remove('active');
      root.innerHTML = '';
      if (onClose) onClose();
    };

    root.querySelector('.modal-overlay').addEventListener('click', close);
    root.querySelector('[data-modal-close]').addEventListener('click', close);

    return { close, root };
  },

  confirm({ title = '确认操作', message, confirmText = '确认', cancelText = '取消', danger = false, onConfirm }) {
    const modal = UI.showModal({
      title,
      body: `<p style="line-height:1.6;color:var(--text-secondary)">${Utils.escapeHtml(message)}</p>`,
      footer: `
        <button class="btn btn-secondary" data-modal-cancel>${Utils.escapeHtml(cancelText)}</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-modal-confirm>${Utils.escapeHtml(confirmText)}</button>
      `
    });

    modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
    modal.root.querySelector('[data-modal-confirm]').addEventListener('click', () => {
      modal.close();
      if (onConfirm) onConfirm();
    });

    return modal;
  },

  closeModal() {
    const root = document.getElementById('modal-root');
    if (root) {
      root.classList.remove('active');
      root.innerHTML = '';
    }
  }
};

/* ===== 计时器组件 ===== */
const Timer = {
  start(label, onEnd) {
    if (App.state.timer) {
      Timer.stop();
    }
    const startTime = Date.now();
    let elapsed = 0;
    let paused = false;

    App.state.timer = { label, startTime, elapsed, paused, onEnd, interval: null };

    const root = document.getElementById('timer-root');
    root.innerHTML = `
      <div class="timer-panel">
        <div>
          <div class="timer-label">${Utils.escapeHtml(label)}</div>
          <div class="timer-time" id="timer-display">00:00</div>
        </div>
        <div class="timer-actions">
          <button class="btn btn-sm btn-secondary" id="timer-pause">暂停</button>
          <button class="btn btn-sm btn-primary" id="timer-stop">结束</button>
        </div>
      </div>
    `;
    root.classList.add('active');

    const display = document.getElementById('timer-display');
    const update = () => {
      if (!paused) {
        elapsed = Math.floor((Date.now() - startTime) / 1000);
        display.textContent = Utils.formatTime(elapsed);
      }
    };
    App.state.timer.interval = setInterval(update, 1000);

    document.getElementById('timer-pause').addEventListener('click', function() {
      paused = !paused;
      this.textContent = paused ? '继续' : '暂停';
      if (paused) {
        App.state.timer.pausedAt = Date.now();
      }
    });

    document.getElementById('timer-stop').addEventListener('click', () => {
      const minutes = Math.max(1, Math.round(elapsed / 60));
      Timer.stop();
      if (onEnd) onEnd(minutes);
    });
  },

  stop() {
    if (App.state.timer && App.state.timer.interval) {
      clearInterval(App.state.timer.interval);
    }
    App.state.timer = null;
    const root = document.getElementById('timer-root');
    if (root) {
      root.classList.remove('active');
      root.innerHTML = '';
    }
  }
};

/* ===== 可视化图表组件 ===== */
const Charts = {
  // 进度环（环形进度条）
  progressRing({ value, max = 100, size = 120, strokeWidth = 10, color = 'var(--primary)', label = '', sublabel = '' }) {
    const percent = Math.min(100, Math.max(0, (value / max) * 100));
    const radius = (size - strokeWidth) / 2;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - (percent / 100) * circumference;

    return `
      <div class="chart-progress-ring" style="width: ${size}px; height: ${size}px;">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle
            cx="${size / 2}"
            cy="${size / 2}"
            r="${radius}"
            fill="none"
            stroke="var(--chart-bg)"
            stroke-width="${strokeWidth}"
          />
          <circle
            cx="${size / 2}"
            cy="${size / 2}"
            r="${radius}"
            fill="none"
            stroke="${color}"
            stroke-width="${strokeWidth}"
            stroke-linecap="round"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"
            transform="rotate(-90 ${size / 2} ${size / 2})"
            style="transition: stroke-dashoffset 0.8s ease;"
          />
        </svg>
        <div class="chart-ring-center">
          <div class="chart-ring-value">${label || Math.round(percent) + '%'}</div>
          ${sublabel ? `<div class="chart-ring-sublabel">${Utils.escapeHtml(sublabel)}</div>` : ''}
        </div>
      </div>
    `;
  },

  // 柱状图（横向）
  barChart({ data, height = 200, color = 'var(--primary)', showValues = true }) {
    if (!data || data.length === 0) {
      return '<div class="chart-empty">暂无数据</div>';
    }
    const maxValue = Math.max(...data.map(d => d.value), 1);

    return `
      <div class="chart-bar-container" style="height: ${height}px;">
        ${data.map((d, i) => {
          const heightPercent = (d.value / maxValue) * 100;
          const barColor = d.color || color;
          return `
            <div class="chart-bar-item">
              <div class="chart-bar-wrapper">
                <div
                  class="chart-bar"
                  style="height: ${heightPercent}%; background: ${barColor}; transition-delay: ${i * 0.05}s;"
                  title="${Utils.escapeHtml(d.label)}: ${d.value}"
                >
                  ${showValues ? `<span class="chart-bar-value">${d.value}</span>` : ''}
                </div>
              </div>
              <div class="chart-bar-label">${Utils.escapeHtml(d.label)}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  },

  // 环形图（分布占比）
  donutChart({ data, size = 160, strokeWidth = 24, centerLabel = '', centerSublabel = '' }) {
    if (!data || data.length === 0) {
      return '<div class="chart-empty">暂无数据</div>';
    }
    const total = data.reduce((sum, d) => sum + d.value, 0);
    if (total === 0) {
      return '<div class="chart-empty">暂无数据</div>';
    }

    const radius = (size - strokeWidth) / 2;
    const circumference = 2 * Math.PI * radius;
    let currentOffset = 0;

    const segments = data.map((d, i) => {
      const percent = (d.value / total) * 100;
      const dashLength = (percent / 100) * circumference;
      const segment = `
        <circle
          cx="${size / 2}"
          cy="${size / 2}"
          r="${radius}"
          fill="none"
          stroke="${d.color || 'var(--primary)'}"
          stroke-width="${strokeWidth}"
          stroke-dasharray="${dashLength} ${circumference - dashLength}"
          stroke-dashoffset="${-currentOffset}"
          transform="rotate(-90 ${size / 2} ${size / 2})"
          style="transition: stroke-dasharray 0.8s ease, stroke-dashoffset 0.8s ease;"
        />
      `;
      currentOffset += dashLength;
      return segment;
    }).join('');

    const legend = data.map(d => `
      <div class="chart-legend-item">
        <span class="chart-legend-dot" style="background: ${d.color || 'var(--primary)'}"></span>
        <span class="chart-legend-label">${Utils.escapeHtml(d.label)}</span>
        <span class="chart-legend-value">${d.value} (${Math.round((d.value / total) * 100)}%)</span>
      </div>
    `).join('');

    return `
      <div class="chart-donut-wrapper">
        <div class="chart-donut-container" style="width: ${size}px; height: ${size}px;">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle
              cx="${size / 2}"
              cy="${size / 2}"
              r="${radius}"
              fill="none"
              stroke="var(--chart-bg)"
              stroke-width="${strokeWidth}"
            />
            ${segments}
          </svg>
          <div class="chart-donut-center">
            <div class="chart-donut-value">${centerLabel || total}</div>
            ${centerSublabel ? `<div class="chart-donut-sublabel">${Utils.escapeHtml(centerSublabel)}</div>` : ''}
          </div>
        </div>
        <div class="chart-legend">${legend}</div>
      </div>
    `;
  },

  // 统计卡片（带图标、数值、标签、趋势）
  statCard({ icon, label, value, trend = '', trendUp = null, color = 'var(--primary)' }) {
    const trendIcon = trendUp === true ? '↑' : trendUp === false ? '↓' : '';
    const trendClass = trendUp === true ? 'trend-up' : trendUp === false ? 'trend-down' : '';

    return `
      <div class="stat-card glass-card">
        <div class="stat-card-icon" style="background: ${color}20; color: ${color};">
          ${icon || ''}
        </div>
        <div class="stat-card-content">
          <div class="stat-card-label">${Utils.escapeHtml(label)}</div>
          <div class="stat-card-value">${value}</div>
          ${trend ? `<div class="stat-card-trend ${trendClass}">${trendIcon} ${Utils.escapeHtml(trend)}</div>` : ''}
        </div>
      </div>
    `;
  }
};

const Router = {
  navigate(pageId) {
    const page = App.pages.find(p => p.id === pageId);

    App.state.currentPage = pageId;
    Router.updateNavHighlight();
    Router.renderPage();
    window.location.hash = pageId;
  },

  updateNavHighlight() {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {

        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });

    const content = document.getElementById('page-content');

    const page = App.state.currentPage;

      ai: Pages.renderAI,
      study: Pages.renderStudy,

      settings: Pages.renderSettings,
      calendar: Pages.renderCalendar,
      habits: Pages.renderHabits,

      habits: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',settings: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
    };
    return icons[name] || '';
  }
};

/* ===== 各模块页面渲染（阶段3+逐步实现，此处为占位） ===== */
const Pages = {
  // 统一绑定点击事件委托：先移除上一次的委托，保证容器上始终只有一个，避免监听器累积导致卡顿/重复触发
  bindClick(container, handler) {
    if (!container) return handler;
    if (container._zmClickHandler) container.removeEventListener('click', container._zmClickHandler);
    container._zmClickHandler = handler;
    container.addEventListener('click', handler);
    return handler;
  },

  renderHome(container) {
    const today = Utils.todayStr();
    const now = new Date();
    const hour = now.getHours();

    // 问候语
    let greeting = '你好';
    if (hour >= 5 && hour < 11) greeting = '早上好';
    else if (hour >= 11 && hour < 13) greeting = '中午好';
    else if (hour >= 13 && hour < 18) greeting = '下午好';
    else if (hour >= 18 && hour < 22) greeting = '晚上好';
    else greeting = '夜深了';

    const weekDay = Utils.getDayName(today);

    // 今日待办（未完成，最多5条）
    const todayTasks = DataStore.Today.getTodayIncomplete().slice(0, 5);
    const totalToday = DataStore.Today.getTasks(today).length;
    const completedToday = DataStore.Today.getTasks(today).filter(t => t.completed).length;
    const todayProgress = totalToday > 0 ? Math.round((completedToday / totalToday) * 100) : 0;

    // 快速备忘
    const memos = DataStore.Home.getMemos();

    // 摘要卡片
    const summaryModules = App.state.data.preferences.homeSummaryModules || [];
    const summaryCards = [];

    if (summaryModules.includes('study')) {
      const minutes = DataStore.Study.getAllWeekMinutes();
      summaryCards.push({
        id: 'study',
        name: '学习',
        value: minutes > 0 ? Utils.formatMinutes(minutes) : '0分钟',
        label: '本周学习',
        color: 'var(--primary)'
      });
    }
    if (summaryModules.includes('fitness')) {
      const count = DataStore.Fitness.getWeekTrainingCount();
      summaryCards.push({
        id: 'fitness',
        name: '健身',
        value: count > 0 ? `${count}次` : '0次',
        label: '本周训练',
        color: '#f59e0b'
      });
    }
    if (summaryModules.includes('diet')) {
      const calories = DataStore.Diet.getTodayCalories();
      const target = App.state.data.preferences.dailyCalorieTarget;
      summaryCards.push({
        id: 'diet',
        name: '饮食',
        value: `${calories}/${target}`,
        label: '今日热量(kcal)',
        color: '#22c55e'
      });
    }
    if (summaryModules.includes('game')) {
      const minutes = DataStore.Game.getAllWeekMinutes();
      summaryCards.push({
        id: 'game',
        name: '游戏',
        value: minutes > 0 ? Utils.formatMinutes(minutes) : '0分钟',
        label: '本周游戏',
        color: '#8b5cf6'
      });
    }

    const priorityLabel = { high: '高', medium: '中', low: '低' };

    // 搜索功能
    const searchKeyword = Pages._homeSearchKeyword || '';
    let searchResults = [];
    if (searchKeyword) {
      const kw = searchKeyword.toLowerCase();
      DataStore.Today.getTasks(today).forEach(t => {
        if (t.title.toLowerCase().includes(kw)) {
          searchResults.push({ type: 'today', typeName: '今日待办', title: t.title, page: 'today' });
        }
      });
      DataStore.Home.getMemos().forEach(m => {
        if (m.content.toLowerCase().includes(kw)) {
          searchResults.push({ type: 'memo', typeName: '备忘', title: m.content, page: 'home' });
        }
      });
      DataStore.Study.getSubjects().forEach(s => {
        if (s.name.toLowerCase().includes(kw)) {
          searchResults.push({ type: 'study', typeName: '学习科目', title: s.name, page: 'study' });
        }
        DataStore.Study.getTasks(s.id).forEach(t => {
          if (t.title.toLowerCase().includes(kw)) {
            searchResults.push({ type: 'study-task', typeName: '学习任务', title: t.title, page: 'study' });
          }
        });
      });
      DataStore.Work.getAllTasks().forEach(t => {
        if (t.title.toLowerCase().includes(kw) || (t.project && t.project.toLowerCase().includes(kw))) {
          searchResults.push({ type: 'work', typeName: '工作任务', title: t.title, page: 'work' });
        }
      });
      DataStore.Game.getGames().forEach(g => {
        if (g.name.toLowerCase().includes(kw) || (g.platform && g.platform.toLowerCase().includes(kw))) {
          searchResults.push({ type: 'game', typeName: '游戏', title: g.name, page: 'game' });
        }
      });
      DataStore.Diet.getMeals(today).forEach(m => {
        if (m.name.toLowerCase().includes(kw)) {
          searchResults.push({ type: 'diet', typeName: '饮食记录', title: m.name, page: 'diet' });
        }
      });
      App.state.data.fitness.plans.forEach(p => {
        p.exercises.forEach(ex => {
          if (ex.name.toLowerCase().includes(kw)) {
            searchResults.push({ type: 'fitness', typeName: '健身动作', title: ex.name, page: 'fitness' });
          }
        });
      });
    }

    const searchResultsHtml = searchKeyword ? `
      <div class="home-search-results card">
        <div class="home-section-header">
          <h3>搜索结果 (${searchResults.length})</h3>
          <button class="btn btn-ghost btn-sm" data-action="clear-search">清除搜索</button>
        </div>
        ${searchResults.length > 0 ? `
          <div class="search-result-list">
            ${searchResults.map(r => `
              <div class="search-result-item" data-action="go-search-result" data-page="${r.page}">
                <span class="search-result-type">${r.typeName}</span>
                <span class="search-result-title">${Utils.escapeHtml(r.title)}</span>
              </div>
            `).join('')}
          </div>
        ` : '<div class="home-empty">没有找到匹配的结果</div>'}
      </div>
    ` : '';

    const renderTaskItem = (task) => {
      const timeStr = task.time ? `<span class="home-task-time">${Utils.escapeHtml(task.time)}</span>` : '';
      return `
        <div class="home-task-item" data-id="${task.id}">
          <div class="task-checkbox" data-action="home-toggle" data-id="${task.id}"></div>
          <div class="home-task-content">
            <span class="home-task-title">${Utils.escapeHtml(task.title)}</span>
            <div class="home-task-meta">
              ${timeStr}
              <span class="badge badge-${task.priority}">${priorityLabel[task.priority] || '中'}</span>
            </div>
          </div>
        </div>
      `;
    };

    const todayTasksHtml = todayTasks.length > 0
      ? todayTasks.map(renderTaskItem).join('')
      : `<div class="home-empty">今天没有待办，去<a href="javascript:void(0)" data-action="go-today" style="color:var(--primary);">添加一条</a>吧</div>`;

    const memosHtml = memos.length > 0
      ? memos.map(m => `
          <div class="memo-card">
            <span class="memo-text">${Utils.escapeHtml(m.content)}</span>
            <button class="memo-delete" data-action="delete-memo" data-id="${m.id}" title="删除">&times;</button>
          </div>
        `).join('')
      : `<div class="home-empty">还没有备忘</div>`;

    const summaryHtml = summaryCards.length > 0
      ? summaryCards.map(card => `
          <div class="summary-card glass-card" data-action="go-module" data-module="${card.id}">
            <div class="summary-card-top-bar" style="background: linear-gradient(90deg, ${card.color}, ${card.color}88);"></div>
            <div class="summary-card-content">
              <div class="summary-name">${card.name}</div>
              <div class="summary-value" style="color:${card.color};">${Utils.escapeHtml(card.value)}</div>
              <div class="summary-label">${card.label}</div>
            </div>
          </div>
        `).join('')
      : `<div class="home-empty">暂无摘要模块，可在设置中配置</div>`;

    container.innerHTML = `
      <div class="page-header home-greeting ${hour >= 6 && hour < 18 ? 'day' : 'night'}">
        ${hour >= 6 && hour < 18 ? `
          <div class="greeting-sun"></div>
          <div class="greeting-cloud cloud1"></div>
          <div class="greeting-cloud cloud2"></div>
          <div class="greeting-grass"></div>
          <div class="greeting-plant plant1">🌿</div>
          <div class="greeting-plant plant2">🌱</div>
          <div class="greeting-plant plant3">🌻</div>
          <div class="greeting-plant plant4">🌷</div>
          <div class="greeting-plant plant5">🍀</div>
          <div class="greeting-butterfly butterfly1">🦋</div>
          <div class="greeting-butterfly butterfly2">🐝</div>
        ` : `
          <div class="greeting-moon"></div>
          <div class="greeting-star star1"></div>
          <div class="greeting-star star2"></div>
          <div class="greeting-star star3"></div>
          <div class="greeting-star star4"></div>
          <div class="greeting-star star5"></div>
          <div class="greeting-star star6"></div>
          <div class="greeting-star star7"></div>
          <div class="greeting-star star8"></div>
          <div class="greeting-star star9"></div>
          <div class="greeting-star star10"></div>
          <div class="greeting-star star11"></div>
          <div class="greeting-star star12"></div>
          <div class="greeting-meteor meteor1"></div>
          <div class="greeting-meteor meteor2"></div>
        `}
        <div class="home-greeting-main">
          <h2>${greeting}，今天是 ${Utils.formatDate(today)} ${weekDay}</h2>
          <div class="home-search-bar">
            <input type="text" class="input" id="home-search-input" placeholder="搜索待办、备忘、学习、工作、游戏、饮食、健身..." value="${Utils.escapeHtml(searchKeyword)}" />
          </div>
        </div>
        <div class="home-greeting-right">
          <div class="home-weather" id="home-weather" title="点击刷新天气">
            <span class="home-weather-loading">天气加载中...</span>
          </div>
          <div class="home-real-time">
          <span class="home-real-time-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </span>
          <span class="home-real-time-text" id="home-real-time">--:--:--</span>
        </div>
        </div>
      </div>

      ${searchResultsHtml}

      <div class="home-top-row">
        <div class="home-today-section card">
          <div class="home-section-header">
            <h3>今日待办</h3>
            <a href="javascript:void(0)" class="home-link" data-action="go-today">查看全部 (${totalToday})</a>
          </div>
          <div class="home-progress-bar">
            <div class="home-progress-info">
              <span class="home-progress-text">完成进度</span>
              <span class="home-progress-count">${completedToday}/${totalToday} · ${todayProgress}%</span>
            </div>
            <div class="home-progress-track">
              <div class="home-progress-fill" style="width:${todayProgress}%;"></div>
            </div>
          </div>
          <div class="home-today-list">
            ${todayTasksHtml}
          </div>
        </div>

        <div class="home-memo-section card">
          <div class="home-section-header">
            <h3>快速备忘</h3>
          </div>
          <div class="memo-input-row">
            <input type="text" class="input" id="memo-input" placeholder="记点什么，回车保存..." />
          </div>
          <div class="memo-list">
            ${memosHtml}
          </div>
        </div>
      </div>

      <div class="home-summary-section">
        <div class="home-section-header">
          <h3>模块概览</h3>
        </div>
        <div class="summary-grid">
          ${summaryHtml}
        </div>
      </div>
    `;

    // 备忘输入
    const memoInput = document.getElementById('memo-input');
    if (memoInput) {
      memoInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = memoInput.value.trim();
          if (val) {
            DataStore.Home.addMemo(val);
            Pages.renderHome(container);
          }
        }
      });
    }

    // 搜索输入
    const searchInput = document.getElementById('home-search-input');
    if (searchInput) {
      let composing = false, searchTimer = null;
      const doSearch = () => {
        Pages._homeSearchKeyword = searchInput.value.trim();
        Pages.renderHome(container);
        const newInput = document.getElementById('home-search-input');
        if (newInput) {
          newInput.focus();
          newInput.setSelectionRange(newInput.value.length, newInput.value.length);
        }
      };
      searchInput.addEventListener('compositionstart', () => { composing = true; });
      searchInput.addEventListener('compositionend', () => {
        composing = false; clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 120);
      });
      searchInput.addEventListener('input', () => {
        if (composing) return;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(doSearch, 200);
      });
    }

    // 事件委托
    Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'home-toggle' && id) {
        DataStore.Today.toggleTask(id);
        Pages.renderHome(container);
      } else if (action === 'delete-memo' && id) {
        DataStore.Home.deleteMemo(id);
        Pages.renderHome(container);
      } else if (action === 'go-today') {
        Router.navigate('today');
      } else if (action === 'go-module') {
        const module = target.dataset.module;
        if (module) Router.navigate(module);
      } else if (action === 'clear-search') {
        Pages._homeSearchKeyword = '';
        Pages.renderHome(container);
      } else if (action === 'go-search-result') {
        const page = target.dataset.page;
        Pages._homeSearchKeyword = '';
        if (page) Router.navigate(page);
      }
    });

    // 实时时钟
    const updateClock = () => {
      const clockEl = document.getElementById('home-real-time');
      if (clockEl) {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        clockEl.textContent = `${h}:${m}:${s}`;
      }
    };
    updateClock();
    // 清除之前的定时器
    if (Pages._homeClockInterval) {
      clearInterval(Pages._homeClockInterval);
    }
    Pages._homeClockInterval = setInterval(updateClock, 1000);
    // ===== 实时天气 =====
    const weatherEl = document.getElementById('home-weather');
    // 渲染天气卡片
    const renderWeather = (w) => {
      if (!weatherEl || !w) return;
      weatherEl.innerHTML = `
        <span class="home-weather-icon">${w.icon}</span>
        <span class="home-weather-temp">${w.temp}°</span>
        <span class="home-weather-detail">
          <span class="home-weather-city">${w.city || '当前位置'}</span>
          <span class="home-weather-desc">${w.desc} ${w.tempMin}°~${w.tempMax}°</span>
        </span>`;
      weatherEl.classList.add('loaded');
    };
    // 显示天气错误/降级状态
    const showWeatherError = (msg) => {
      if (!weatherEl) return;
      weatherEl.innerHTML = `<span class="home-weather-error">${msg || '天气不可用'} · 点击重试</span>`;
    };
    // 先显示缓存
    const cached = DataStore.Weather.getCachedWeather();
    if (cached) renderWeather(cached);
    // 异步加载最新天气（设置中可关闭）
    if (App.state.data.preferences.weatherEnabled !== false) {
      DataStore.Weather.loadWeather().then(w => renderWeather(w)).catch(err => {
        if (!cached) {
          let msg = '天气不可用';
          if (err && err.code === 1) msg = '未授权定位';
          showWeatherError(msg);
        }
      });
    } else {
      showWeatherError('天气已关闭');
    }
    // 点击天气区域手动刷新
    if (weatherEl && !weatherEl._refreshBound) {
      weatherEl._refreshBound = true;
      weatherEl.addEventListener('click', () => {
        weatherEl.innerHTML = '<span class="home-weather-loading">刷新中...</span>';
        DataStore.Weather.loadWeather().then(w => renderWeather(w)).catch(() => showWeatherError('刷新失败'));
      });
    }
  },

  renderToday(container) {
    const today = Utils.todayStr();
    const allTasks = DataStore.Today.getTasks(today);
    const incomplete = allTasks.filter(t => !t.completed);
    const completed = allTasks.filter(t => t.completed);

    // 按时间排序：有时间的按时间升序，没时间的排最后
    const sortByTime = (a, b) => {
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time.localeCompare(b.time);
    };
    incomplete.sort(sortByTime);

    // 已完成区折叠状态（模块局部变量）
    if (typeof Pages._todayCompletedCollapsed === 'undefined') {
      Pages._todayCompletedCollapsed = false;
    }

    const priorityLabel = { high: '高', medium: '中', low: '低' };

    const renderTaskItem = (task, isCompleted) => {
      const priorityClass = `badge-${task.priority}`;
      const timeStr = task.time ? `<span class="task-time">${Utils.escapeHtml(task.time)}</span>` : '';
      const titleClass = isCompleted ? 'task-title completed' : 'task-title';
      const notesHtml = task.notes ? `<div class="task-notes">${Utils.escapeHtml(task.notes)}</div>` : '';
      return `
        <div class="task-item ${isCompleted ? 'is-completed' : ''}" data-id="${task.id}">
          <div class="task-checkbox ${task.completed ? 'checked' : ''}" data-action="toggle" data-id="${task.id}">
            ${task.completed ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
          <div class="task-main">
            <span class="${titleClass}">${Utils.escapeHtml(task.title)}</span>
            <div class="task-meta">
              ${timeStr}
              <span class="badge ${priorityClass}">${priorityLabel[task.priority] || '中'}</span>
            </div>
            ${notesHtml}
          </div>
          <div class="task-actions">
            <button class="btn btn-ghost btn-sm" data-action="edit" data-id="${task.id}" title="编辑">编辑</button>
            <button class="btn btn-ghost btn-sm text-danger" data-action="delete" data-id="${task.id}" title="删除">删除</button>
          </div>
        </div>
      `;
    };

    const incompleteHtml = incomplete.length > 0
      ? incomplete.map(t => renderTaskItem(t, false)).join('')
      : `<div class="empty-state"><h3>今天没有待办</h3><p>在上方添加第一条计划吧</p></div>`;

    const completedHtml = completed.length > 0
      ? `
        <div class="today-section completed-section">
          <div class="completed-header" data-action="toggle-completed">
            <span>已完成 (${completed.length})</span>
            <span class="completed-toggle">${Pages._todayCompletedCollapsed ? '展开' : '收起'}</span>
          </div>
          <div class="completed-list ${Pages._todayCompletedCollapsed ? 'hidden' : ''}">
            ${completed.map(t => renderTaskItem(t, true)).join('')}
          </div>
        </div>
      `
      : '';

    container.innerHTML = `
      <div class="page-header">
        <h2>今日计划</h2>
        <p>${Utils.formatDate(today)} · 共 ${allTasks.length} 项，已完成 ${completed.length} 项</p>
      </div>

      <div class="today-add-bar">
        <button class="btn btn-primary btn-round" data-action="add-today" title="添加待办">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="btn btn-secondary" data-action="ai-schedule">智能排程</button>
      </div>

      <div class="today-section">
        <h3 class="section-title">待办 (${incomplete.length})</h3>
        <div class="task-list">
          ${incompleteHtml}
        </div>
      </div>

      ${completedHtml}

      <div class="chart-section">
        <h3 class="chart-section-title">数据统计</h3>
        <div class="chart-grid">
          <div class="chart-card glass-card">
            <div class="chart-card-title">完成率</div>
            <div style="display: flex; justify-content: center;">
              ${Charts.progressRing({
                value: completed.length,
                max: allTasks.length || 1,
                size: 120,
                strokeWidth: 10,
                color: 'var(--success)',
                sublabel: '已完成/总数'
              })}
            </div>
          </div>
          <div class="chart-card glass-card">
            <div class="chart-card-title">优先级分布</div>
            ${Charts.donutChart({
              data: [
                { label: '高优先级', value: allTasks.filter(t => t.priority === 'high').length, color: 'var(--danger)' },
                { label: '中优先级', value: allTasks.filter(t => t.priority === 'medium').length, color: 'var(--primary)' },
                { label: '低优先级', value: allTasks.filter(t => t.priority === 'low').length, color: 'var(--success)' }
              ],
              size: 120,
              strokeWidth: 20,
              centerLabel: allTasks.length,
              centerSublabel: '总任务'
            })}
          </div>
        </div>
        <div class="chart-grid" style="margin-top: 16px; grid-template-columns: repeat(4, 1fr);">
          ${Charts.statCard({ label: '总任务', value: allTasks.length, color: 'var(--primary)', icon: '📋' })}
          ${Charts.statCard({ label: '已完成', value: completed.length, color: 'var(--success)', icon: '✅' })}
          ${Charts.statCard({ label: '未完成', value: incomplete.length, color: 'var(--warning)', icon: '⏳' })}
          ${Charts.statCard({ label: '高优先级', value: allTasks.filter(t => t.priority === 'high').length, color: 'var(--danger)', icon: '🔥' })}
        </div>
      </div>
    `;

    // 显示添加待办弹窗
    const showAddModal = () => {
      const modal = UI.showModal({
        title: '添加待办',
        body: `
          <div class="form-group">
            <label>待办内容 <span style="color:var(--danger)">*</span></label>
            <input type="text" class="input" id="add-today-title" placeholder="输入待办事项..." />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>时间</label>
              <input type="time" class="input" id="add-today-time" />
            </div>
            <div class="form-group">
              <label>优先级</label>
              <select class="select" id="add-today-priority">
                <option value="high">高优先级</option>
                <option value="medium" selected>中优先级</option>
                <option value="low">低优先级</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea class="textarea" id="add-today-notes" placeholder="可选备注信息..." rows="3"></textarea>
          </div>
        `,
        footer: `
          <button class="btn btn-secondary" data-modal-cancel>取消</button>
          <button class="btn btn-primary" data-modal-save>添加</button>
        `
      });
      // 自动聚焦标题输入框
      setTimeout(() => {
        const titleInput = modal.root.querySelector('#add-today-title');
        if (titleInput) titleInput.focus();
      }, 50);
      modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
      modal.root.querySelector('[data-modal-save]').addEventListener('click', () => {
        const title = modal.root.querySelector('#add-today-title').value.trim();
        if (!title) {
          modal.root.querySelector('#add-today-title').focus();
          return;
        }
        DataStore.Today.addTask({
          title,
          time: modal.root.querySelector('#add-today-time').value || '',
          priority: modal.root.querySelector('#add-today-priority').value,
          notes: modal.root.querySelector('#add-today-notes').value.trim()
        });
        modal.close();
        Pages.renderToday(container);
      });
    };

    // 事件委托：勾选、编辑、删除、折叠、添加
    Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'ai-schedule') {
        // 智能排程功能
        const incomplete = allTasks.filter(t => !t.completed);
        if (incomplete.length === 0) {
          UI.toast('今天没有待办需要排程', 'default');
          return;
        }
        // 按优先级排序
        const priorityOrder = { high: 0, medium: 1, low: 2 };
        const sorted = [...incomplete].sort((a, b) => (priorityOrder[a.priority] || 1) - (priorityOrder[b.priority] || 1));
        // 生成时间安排（从9:00开始，每个任务30分钟）
        let hour = 9;
        let minute = 0;
        const schedule = sorted.map(task => {
          const startTime = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
          minute += 30;
          if (minute >= 60) { minute = 0; hour++; }
          const endTime = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
          return { task, startTime, endTime };
        });
        // 显示排程结果
        const priorityLabel = { high: '高', medium: '中', low: '低' };
        const scheduleHtml = schedule.map(s => '<div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:var(--bg-hover);margin-bottom:8px;"><span style="font-family:monospace;font-size:13px;color:var(--primary);min-width:110px;">' + s.startTime + '-' + s.endTime + '</span><span style="flex:1;font-size:14px;">' + Utils.escapeHtml(s.task.title) + '</span><span class="badge badge-' + s.task.priority + '" style="font-size:11px;">' + (priorityLabel[s.task.priority] || '中') + '</span></div>').join('');
        const modal = UI.showModal({
          title: '智能排程结果',
          body: '<p style="color:var(--text-secondary);margin-bottom:16px;font-size:13px;">已根据优先级为你安排今天的时间，每个任务30分钟：</p>' + scheduleHtml,
          footer: '<button class="btn btn-secondary" data-modal-cancel>关闭</button><button class="btn btn-primary" data-modal-ok>应用到任务时间</button>'
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          // 将排程时间应用到任务
          schedule.forEach(s => {
            DataStore.Today.updateTask(s.task.id, { time: s.startTime });
          });
          modal.close();
          UI.toast('已应用排程时间', 'success');
          Pages.renderToday(container);
        });
      } else if (action === 'add-today') {
        showAddModal();
      } else if (action === 'toggle' && id) {
        DataStore.Today.toggleTask(id);
        Pages.renderToday(container);
      } else if (action === 'edit' && id) {
        const task = App.state.data.today.tasks.find(t => t.id === id);
        if (!task) return;
        const modal = UI.showModal({
          title: '编辑待办',
          body: `
            <div class="form-group">
              <label>标题</label>
              <input type="text" class="input" id="edit-title" value="${Utils.escapeHtml(task.title)}" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>时间</label>
                <input type="time" class="input" id="edit-time" value="${Utils.escapeHtml(task.time || '')}" />
              </div>
              <div class="form-group">
                <label>优先级</label>
                <select class="select" id="edit-priority">
                  <option value="high" ${task.priority === 'high' ? 'selected' : ''}>高</option>
                  <option value="medium" ${task.priority === 'medium' ? 'selected' : ''}>中</option>
                  <option value="low" ${task.priority === 'low' ? 'selected' : ''}>低</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea class="textarea" id="edit-notes" placeholder="可选备注信息..." rows="3">${Utils.escapeHtml(task.notes || '')}</textarea>
            </div>
          `,
          footer: `
            <button class="btn btn-secondary" data-modal-cancel>取消</button>
            <button class="btn btn-primary" data-modal-save>保存</button>
          `
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-save]').addEventListener('click', () => {
          const newTitle = modal.root.querySelector('#edit-title').value.trim();
          if (!newTitle) return;
          DataStore.Today.updateTask(id, {
            title: newTitle,
            time: modal.root.querySelector('#edit-time').value || '',
            priority: modal.root.querySelector('#edit-priority').value,
            notes: modal.root.querySelector('#edit-notes').value.trim()
          });
          modal.close();
          Pages.renderToday(container);
        });
      } else if (action === 'delete' && id) {
        UI.confirm({
          title: '删除待办',
          message: '确定要删除这条待办吗？此操作不可撤销。',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            DataStore.Today.deleteTask(id);
            Pages.renderToday(container);
          }
        });
      } else if (action === 'toggle-completed') {
        Pages._todayCompletedCollapsed = !Pages._todayCompletedCollapsed;
        Pages.renderToday(container);
      }
    });
  },

  renderStudy(container) {
    // 当前选中科目（模块局部变量）
    if (typeof Pages._studySelectedId === 'undefined') {
      Pages._studySelectedId = null;
    }

    const subjects = DataStore.Study.getSubjects();

    // 如果没有选中科目，默认选中第一个
    if (!Pages._studySelectedId && subjects.length > 0) {
      Pages._studySelectedId = subjects[0].id;
    }

    const selectedSubject = subjects.find(s => s.id === Pages._studySelectedId);

    const renderSubjectList = () => {
      if (subjects.length === 0) {
        return `<div class="study-empty-hint">还没有科目，点击下方添加</div>`;
      }
      return subjects.map(s => `
        <div class="study-subject-item ${s.id === Pages._studySelectedId ? 'active' : ''}" data-action="select-subject" data-id="${s.id}">
          <span class="study-subject-name">${Utils.escapeHtml(s.name)}</span>
          <div class="study-subject-actions">
            <button class="btn btn-ghost btn-sm" data-action="rename-subject" data-id="${s.id}" title="重命名">重命名</button>
            <button class="btn btn-ghost btn-sm text-danger" data-action="delete-subject" data-id="${s.id}" title="删除">删除</button>
          </div>
        </div>
      `).join('');
    };

    const renderSubjectDetail = () => {
      if (!selectedSubject) {
        return `<div class="empty-state"><h3>选择或添加一个科目</h3><p>在左侧选择科目，或添加新的学习科目</p></div>`;
      }

      const sid = selectedSubject.id;
      const tasks = DataStore.Study.getTasks(sid);
      const records = DataStore.Study.getRecords(sid).slice(0, 10);
      const totalMin = DataStore.Study.getTotalMinutes(sid);
      const weekMin = DataStore.Study.getWeekMinutes(sid);

      const tasksHtml = tasks.length > 0
        ? tasks.map(task => {
            const percent = task.targetMinutes > 0 ? Math.min(100, Math.round(task.completedMinutes / task.targetMinutes * 100)) : 0;
            return `
              <div class="study-task-item">
                <div class="study-task-header">
                  <span class="study-task-title">${Utils.escapeHtml(task.title)}</span>
                  <div class="study-task-actions">
                    <button class="btn btn-primary btn-sm" data-action="start-study" data-id="${task.id}">开始学习</button>
                    <button class="btn btn-ghost btn-sm text-danger" data-action="delete-task" data-id="${task.id}">删除</button>
                  </div>
                </div>
                <div class="study-task-progress">
                  <div class="progress-bar">
                    <div class="progress-fill" style="width:${percent}%"></div>
                  </div>
                  <span class="progress-text">${Utils.formatMinutes(task.completedMinutes || 0)} / ${task.targetMinutes > 0 ? Utils.formatMinutes(task.targetMinutes) : '未设目标'}</span>
                </div>
              </div>
            `;
          }).join('')
        : `<div class="study-empty-hint">还没有学习任务</div>`;

      const recordsHtml = records.length > 0
        ? records.map(r => `
            <div class="study-record-item">
              <span class="study-record-date">${Utils.formatDate(r.date)}</span>
              <span class="study-record-duration">${Utils.formatMinutes(r.minutes)}</span>
            </div>
          `).join('')
        : `<div class="study-empty-hint">还没有学习记录</div>`;

      return `
        <div class="study-detail-header">
          <h3>${Utils.escapeHtml(selectedSubject.name)}</h3>
          <div class="study-stats">
            <div class="study-stat">
              <span class="stat-value">${Utils.formatMinutes(totalMin)}</span>
              <span class="stat-label">累计学习</span>
            </div>
            <div class="study-stat">
              <span class="stat-value">${Utils.formatMinutes(weekMin)}</span>
              <span class="stat-label">本周学习</span>
            </div>
          </div>
        </div>

        <div class="study-section">
          <div class="study-section-header">
            <h4>学习任务</h4>
            <button class="btn btn-primary btn-sm" data-action="add-task">添加任务</button>
          </div>
          <div class="study-task-list">
            ${tasksHtml}
          </div>
        </div>

        <div class="study-section">
          <div class="study-section-header">
            <h4>学习记录</h4>
            <button class="btn btn-secondary btn-sm" data-action="add-record">手动补录</button>
          </div>
          <div class="study-record-list">
            ${recordsHtml}
          </div>
        </div>
      `;
    };

    container.innerHTML = `
      <div class="page-header">
        <h2>学习计划</h2>
        <p>按科目管理学习任务和进度</p>
      </div>
      <div class="study-layout">
        <div class="study-sidebar card">
          <div class="study-sidebar-header">
            <h3>科目</h3>
            <button class="btn btn-primary btn-sm" data-action="add-subject">添加</button>
          </div>
          <div class="study-subject-list">
            ${renderSubjectList()}
          </div>
        </div>
        <div class="study-main card">
          ${renderSubjectDetail()}
        </div>
      </div>

      <div class="chart-section">
        <h3 class="chart-section-title">学习统计</h3>
        <div class="chart-grid">
          <div class="chart-card glass-card">
            <div class="chart-card-title">本周学习时长</div>
            <div style="display: flex; justify-content: center;">
              ${Charts.progressRing({
                value: DataStore.Study.getAllWeekMinutes(),
                max: 600,
                size: 120,
                strokeWidth: 10,
                color: 'var(--primary)',
                label: Utils.formatMinutes(DataStore.Study.getAllWeekMinutes()),
                sublabel: '目标10小时'
              })}
            </div>
          </div>
          <div class="chart-card glass-card">
            <div class="chart-card-title">科目时长分布</div>
            ${Charts.donutChart({
              data: subjects.map((s, i) => ({
                label: s.name,
                value: DataStore.Study.getTotalMinutes(s.id),
                color: ['var(--primary)', 'var(--purple)', 'var(--success)', 'var(--warning)', 'var(--danger)', 'var(--orange)'][i % 6]
              })).filter(d => d.value > 0),
              size: 120,
              strokeWidth: 20,
              centerLabel: Utils.formatMinutes(subjects.reduce((sum, s) => sum + DataStore.Study.getTotalMinutes(s.id), 0)),
              centerSublabel: '总时长'
            })}
          </div>
        </div>
        <div class="chart-grid" style="margin-top: 16px; grid-template-columns: repeat(4, 1fr);">
          ${Charts.statCard({ label: '本周学习', value: Utils.formatMinutes(DataStore.Study.getAllWeekMinutes()), color: 'var(--primary)', icon: '📚' })}
          ${Charts.statCard({ label: '总学习时长', value: Utils.formatMinutes(subjects.reduce((sum, s) => sum + DataStore.Study.getTotalMinutes(s.id), 0)), color: 'var(--purple)', icon: '⏱️' })}
          ${Charts.statCard({ label: '科目数', value: subjects.length, color: 'var(--success)', icon: '📖' })}
          ${Charts.statCard({ label: '学习任务', value: subjects.reduce((sum, s) => sum + (DataStore.Study.getTasks(s.id) || []).length, 0), color: 'var(--warning)', icon: '✅' })}
        </div>
      </div>
    `;

    // 事件委托
    Pages.bindClick(container, (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'select-subject' && id) {
        Pages._studySelectedId = id;
        Pages.renderStudy(container);
      } else if (action === 'add-subject') {
        const modal = UI.showModal({
          title: '添加科目',
          body: `<div class="form-group"><label>科目名称</label><input type="text" class="input" id="new-subject-name" placeholder="例如：高等数学" /></div>`,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>添加</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const name = modal.root.querySelector('#new-subject-name').value.trim();
          if (name) {
            const subj = DataStore.Study.addSubject(name);
            Pages._studySelectedId = subj.id;
            modal.close();
            Pages.renderStudy(container);
          }
        });
      } else if (action === 'rename-subject' && id) {
        const subj = subjects.find(s => s.id === id);
        if (!subj) return;
        const modal = UI.showModal({
          title: '重命名科目',
          body: `<div class="form-group"><label>科目名称</label><input type="text" class="input" id="rename-subject-name" value="${Utils.escapeHtml(subj.name)}" /></div>`,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>保存</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const name = modal.root.querySelector('#rename-subject-name').value.trim();
          if (name) {
            DataStore.Study.renameSubject(id, name);
            modal.close();
            Pages.renderStudy(container);
          }
        });
      } else if (action === 'delete-subject' && id) {
        UI.confirm({
          title: '删除科目',
          message: '确定要删除这个科目吗？该科目下的所有任务和学习记录也会被删除，此操作不可撤销。',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            DataStore.Study.deleteSubject(id);
            if (Pages._studySelectedId === id) Pages._studySelectedId = null;
            Pages.renderStudy(container);
          }
        });
      } else if (action === 'add-task') {
        if (!selectedSubject) return;
        const modal = UI.showModal({
          title: '添加学习任务',
          body: `
            <div class="form-group"><label>任务名称</label><input type="text" class="input" id="new-task-title" placeholder="例如：复习第三章" /></div>
            <div class="form-group"><label>目标时长（分钟，可选）</label><input type="number" class="input" id="new-task-target" min="0" placeholder="例如：120" /></div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>添加</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const title = modal.root.querySelector('#new-task-title').value.trim();
          const target = parseInt(modal.root.querySelector('#new-task-target').value) || 0;
          if (title) {
            DataStore.Study.addTask(selectedSubject.id, title, target);
            modal.close();
            Pages.renderStudy(container);
          }
        });
      } else if (action === 'start-study' && id) {
        const task = App.state.data.study.tasks.find(t => t.id === id);
        if (!task) return;
        Timer.start(`学习：${task.title}`, (minutes) => {
          DataStore.Study.addRecord(selectedSubject.id, id, Utils.todayStr(), minutes);
          UI.toast(`已记录学习 ${Utils.formatMinutes(minutes)}`, 'success');
          Pages.renderStudy(container);
        });
      } else if (action === 'delete-task' && id) {
        UI.confirm({
          title: '删除任务',
          message: '确定要删除这个学习任务吗？',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            DataStore.Study.deleteTask(id);
            Pages.renderStudy(container);
          }
        });
      } else if (action === 'add-record') {
        if (!selectedSubject) return;
        const modal = UI.showModal({
          title: '手动补录学习记录',
          body: `
            <div class="form-group"><label>日期</label><input type="date" class="input" id="new-record-date" value="${Utils.todayStr()}" /></div>
            <div class="form-group"><label>学习时长（分钟）</label><input type="number" class="input" id="new-record-minutes" min="1" placeholder="例如：60" /></div>
          `,
          footer: `<button class="btn btn-secondary" data-modal-cancel>取消</button><button class="btn btn-primary" data-modal-ok>保存</button>`
        });
        modal.root.querySelector('[data-modal-cancel]').addEventListener('click', () => modal.close());
        modal.root.querySelector('[data-modal-ok]').addEventListener('click', () => {
          const date = modal.root.querySelector('#new-record-date').value;
          const minutes = parseInt(modal.root.querySelector('#new-record-minutes').value);
          if (date && minutes > 0) {
            DataStore.Study.addRecord(selectedSubject.id, null, date, minutes);
            modal.close();
            Pages.renderStudy(container);
          }
        });
      }
    });
  },

  renderWork(container) {
    const columns = [
      { id: 'todo', name: '待办' },
      { id: 'in_progress', name: '进行中' },
      { id: 'done', name: '已完成' }
    ];

    const priorityLabel = { high: '高', medium: '中', low: '低' };

    // 项目标签颜色（简单哈希）
    const getProjectColor = (project) => {
      if (!project) return '#94a3b8';
      const colors = ['#0d9488', '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#22c55e', '#ef4444', '#14b8a6'];
      let hash = 0;
      for (let i = 0; i < project.length; i++) {
        hash = project.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    };

    const isOverdue = (dueDate) => {
      if (!dueDate) return false;
      return dueDate < Utils.todayStr();
    };

    const renderTaskCard = (task) => {
      const colIdx = columns.findIndex(c => c.id === task.status);
      const canMoveLeft = colIdx > 0;
      const canMoveRight = colIdx < columns.length - 1;
      const overdue = isOverdue(task.dueDate) && task.status !== 'done';

      return `
        <div class="work-card" data-id="${task.id}">
          <div class="work-card-header">
            <span class="work-card-title">${Utils.escapeHtml(task.title)}</span>
          </div>
          ${task.project ? `<span class="work-project-tag" style="background:${getProjectColor(task.project)}15;color:${getProjectColor(task.project)};">${Utils.escapeHtml(task.project)}</span>` : ''}
          <div class="work-card-meta">
            ${task.dueDate ? `<span class="work-due ${overdue ? 'overdue' : ''}">${Utils.formatDate(task.dueDate)}</span>` : ''}
            <span class="badge badge-${task.priority}">${priorityLabel[task.priority] || '中'}</span>
          </div>
          ${task.notes ? `<div class="work-card-notes">${Utils.escapeHtml(task.notes)}</div>` : ''}
          <div class="work-card-actions">
            ${canMoveLeft ? `<button class="btn btn-ghost btn-sm" data-action="move-left" data-id="${task.id}" title="移到上一列">←</button>` : ''}
